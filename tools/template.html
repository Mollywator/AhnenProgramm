/* ---- reading the light palette ------------------------------------------ */
function lightTokens(){
  const root = document.documentElement;
  const was = root.getAttribute("data-theme");
  root.setAttribute("data-theme", "tag");
  const style = getComputedStyle(root);
  const pick = name => style.getPropertyValue(name).trim();
  const out = {
    paper: pick("--paper"), paper2: pick("--paper-2"), card: pick("--card"),
    ink: pick("--ink"), ink2: pick("--ink-2"), ink3: pick("--ink-3"),
    rule: pick("--rule"), rule2: pick("--rule-2"), accent: pick("--accent"),
    accentSoft: pick("--accent-soft"), male: pick("--male"), female: pick("--female"),
    heiratFill: pick("--heirat-fill"), heiratLine: pick("--heirat-line"),
    indirektFill: pick("--indirekt-fill"), indirektLine: pick("--indirekt-line"),
    serif: pick("--serif"), sans: pick("--sans"),
  };
  if(was) root.setAttribute("data-theme", was); else root.removeAttribute("data-theme");
  return out;
}

/* ---- text that has to fit into 208 pixels -------------------------------- */
const ruler = document.createElement("canvas").getContext("2d");
function clip(text, font, room){
  ruler.font = font;
  if(ruler.measureText(text).width <= room) return text;
  let cut = text;
  while(cut.length > 1 && ruler.measureText(cut + "…").width > room) cut = cut.slice(0, -1);
  return cut + "…";
}

/* On screen a name that does not fit is cut off, because a row of boxes has to
   keep one type size to stay readable while scrolling.  On a poster that is
   just a lost surname, so here the type shrinks first and only gives up at
   10.5px - which still prints. */
function fitting(text, family, size, room, floor){
  let px = size;
  while(px > floor){
    ruler.font = px + "px " + family;
    if(ruler.measureText(text).width <= room) break;
    px -= 0.5;
  }
  return px;
}

const xml = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&apos;");

/* ---- the drawing --------------------------------------------------------- */
function diagramSVG(){
  const plane = document.getElementById("plane");
  const width = Math.ceil(parseFloat(plane.style.width) || plane.scrollWidth);
  const height = Math.ceil(parseFloat(plane.style.height) || plane.scrollHeight);
  const t = lightTokens();
  const pad = 40;
  const parts = [];

  /* the wires are already SVG on screen; only their colours live in CSS, so
     they are the one thing that can be copied over almost as it is */
  const wireStyle = {
    "": [t.rule2, 1.5, null],
    marriage: [t.ink3, 1.5, null],
    bridge: [t.heiratLine, 2, null],
    far: [t.indirektLine, 1.5, "7 5"],
  };
  for(const path of plane.querySelectorAll(".wires path")){
    const kind = ["marriage", "bridge", "far"].find(k => path.classList.contains(k)) || "";
    const [stroke, w, dash] = wireStyle[kind];
    parts.push(`<path d="${xml(path.getAttribute("d"))}" fill="none" stroke="${stroke}" ` +
      `stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`);
  }

  /* the tinted islands of the Sippen design */
  for(const hull of plane.querySelectorAll(".hull")){
    const x = parseFloat(hull.style.left), y = parseFloat(hull.style.top);
    const w = parseFloat(hull.style.width), h = parseFloat(hull.style.height);
    parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" ` +
      `fill="${t.indirektFill}" fill-opacity="0.5" stroke="${t.indirektLine}" stroke-dasharray="5 4"/>`);
    const label = hull.querySelector(".hull-label");
    if(label) parts.push(`<text x="${x + 14}" y="${y + 13}" font-family="${xml(t.sans)}" ` +
      `font-size="11.5" letter-spacing="1" fill="${t.indirektLine}">${xml(label.textContent)}</text>`);
  }

  const tagFont = '11.5px ' + t.sans;
  const dateFont = '11.5px ' + t.sans;

  for(const box of plane.querySelectorAll(".box")){
    const x = parseFloat(box.style.left), y = parseFloat(box.style.top);
    const w = parseFloat(box.style.width) || 208, h = parseFloat(box.style.height) || 74;
    const person = BY_ID.get(+box.dataset.person);
    if(!person) continue;
    const centred = box.classList.contains("centre");
    const married = box.classList.contains("married");

    if(centred)
      parts.push(`<rect x="${x - 4}" y="${y - 4}" width="${w + 8}" height="${h + 8}" rx="6" fill="${t.accentSoft}"/>`);

    parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" ` +
      `fill="${married ? t.heiratFill : t.card}" ` +
      `stroke="${centred ? t.accent : t.rule2}" stroke-width="${centred ? 2 : 1}"` +
      `${married ? ' stroke-dasharray="5 3"' : ""}/>`);

    if(box.classList.contains("blood")){
      const edge = box.classList.contains("up") ? t.male
                 : box.classList.contains("down") ? t.female
                 : box.classList.contains("side") ? t.accent : t.rule2;
      parts.push(`<rect x="${x}" y="${y + 1}" width="3" height="${h - 2}" fill="${edge}"/>`);
    }

    // portrait, or the initials where the report had none
    const shot = PHOTOS[person.id];
    const px = x + 8, py = y + (h - 46) / 2;
    if(shot){
      parts.push(`<image x="${px}" y="${py}" width="36" height="46" preserveAspectRatio="xMidYMid slice" ` +
        `href="${xml(shot)}"${isGone(person) ? ' filter="url(#entfaerbt)"' : ""}/>`);
    } else {
      parts.push(`<rect x="${px}" y="${py}" width="36" height="46" fill="${t.paper2}" stroke="${t.rule}"/>`);
      parts.push(`<text x="${px + 18}" y="${py + 27}" text-anchor="middle" font-family="${xml(t.sans)}" ` +
        `font-size="12" fill="${t.ink3}">${xml(initials(person))}</text>`);
    }

    const tx = px + 45;
    const room = w - (tx - x) - 12;
    const tag = box.querySelector(".lines i");
    const dates = box.querySelector(".lines u");
    const nameSize = fitting(person.name, t.serif, 15.5, room, 10.5);
    parts.push(`<text x="${tx}" y="${y + 27}" font-family="${xml(t.serif)}" font-size="${nameSize}" ` +
      `font-weight="${centred ? 600 : 500}" fill="${centred ? t.accent : married ? t.ink2 : t.ink}">` +
      `${xml(clip(person.name, nameSize + "px " + t.serif, room))}</text>`);
    if(tag) parts.push(`<text x="${tx}" y="${y + 43}" font-family="${xml(t.sans)}" font-size="11.5" ` +
      `letter-spacing="0.7" fill="${tag.classList.contains("rel") ? t.accent : t.ink3}">` +
      `${xml(clip(tag.textContent.trim(), tagFont, room))}</text>`);
    if(dates) parts.push(`<text x="${tx}" y="${y + 58}" font-family="${xml(t.sans)}" font-size="11.5" ` +
      `letter-spacing="0.5" fill="${t.ink2}">` +
      `${xml(clip(dates.textContent.replace(/\s+/g, " ").trim(), dateFont, room))}</text>`);
  }

  const title = (BY_ID.get(centre) || {}).name || "";
  const viewName = {nah: "Nahe Familie", ahnen: "Ahnentafel", blut: "Ganze Linie", alle: "Alle"}[mode] || mode;

  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ` +
    `width="${width + pad * 2}" height="${height + pad * 2 + 34}" ` +
    `viewBox="${-pad} ${-pad} ${width + pad * 2} ${height + pad * 2 + 34}">
  <title>${xml(DATA.meta.title + " – " + viewName + (title ? " um " + title : ""))}</title>
  <defs><filter id="entfaerbt"><feColorMatrix type="saturate" values="0"/></filter></defs>
  <rect x="${-pad}" y="${-pad}" width="${width + pad * 2}" height="${height + pad * 2 + 34}" fill="${t.paper}"/>
  ${parts.join("\n  ")}
  <text x="0" y="${height + 26}" font-family="${xml(t.sans)}" font-size="12" letter-spacing="1" fill="${t.ink3}">${
    xml(DATA.meta.title.toUpperCase() + " · " + viewName.toUpperCase() +
        (title ? " · MITTELPUNKT " + title.toUpperCase() : ""))}</text>
</svg>`;
}

/* ---- and the same drawing as a picture ----------------------------------- */
/* Browsers stop at 16384 pixels in either direction; beyond that the canvas is
   silently blank, which is worse than a refusal. */
const PNG_LIMIT = 16384;

function pngPossible(){
  const plane = document.getElementById("plane");
  const w = Math.ceil(parseFloat(plane.style.width) || 0) + 80;
  const h = Math.ceil(parseFloat(plane.style.height) || 0) + 114;
  return {ok: w <= PNG_LIMIT && h <= PNG_LIMIT, w, h};
}

function svgToPNG(svg, w, h){
  return new Promise((done, fail) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const pen = canvas.getContext("2d");
      pen.drawImage(img, 0, 0, w, h);
      try{ done(canvas.toDataURL("image/png").split(",")[1]); }
      catch(err){ fail(new Error("Das Bild ließ sich nicht erzeugen: " + err.message)); }
    };
    img.onerror = () => fail(new Error("Die Zeichnung ließ sich nicht in ein Bild verwandeln."));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

/* ---- jumping between trees ------------------------------------------------
   Switching tree is a reload of the whole page, so what the jump wants to say
   - land on this person, and remember where I came from - has to outlive it.
   sessionStorage does that and nothing more: it is gone when the window
   closes, it never reaches the file, and a second window has its own. */
const JUMP_KEY = "stammbaum:sprung";

async function jumpToTree(slug, personId){
  const zurueck = {slug: EDIT.offen, person: centre, titel: DATA.meta.title || EDIT.offen};
  try{
    sessionStorage.setItem(JUMP_KEY, JSON.stringify({zu: personId, von: zurueck}));
  }catch(e){ /* private window - the jump still works, only the way back is lost */ }
  await switchTree(slug);
}

async function jumpBack(){
  let von = null;
  try{ von = JSON.parse(sessionStorage.getItem(JUMP_KEY) || "null"); }catch(e){}
  if(!von || !von.von) return;
  try{
    sessionStorage.setItem(JUMP_KEY, JSON.stringify({zu: von.von.person, von: null}));
  }catch(e){}
  await switchTree(von.von.slug);
}

/* Read once on load: centre on the person that was jumped to, and put the way
   back in the masthead.  Both are dropped silently when the person is not in
   this tree - a link that was removed on the far side must not leave the page
   pointing at a number that means somebody else now. */
function applyJump(){
  let sprung = null;
  try{ sprung = JSON.parse(sessionStorage.getItem(JUMP_KEY) || "null"); }catch(e){ return; }
  if(!sprung) return;
  if(sprung.zu != null && BY_ID.has(sprung.zu)){
    setCentre(sprung.zu);
    setMode("nah");
    renderTree();
    renderList();
  }
  const bar = document.getElementById("backBar");
  if(bar && sprung.von && sprung.von.slug){
    bar.innerHTML = `<button class="btn" id="backToTree" title="Zurück in den Stammbaum, aus dem du gekommen bist">↩ zurück zu ${esc(sprung.von.titel || sprung.von.slug)}</button>`;
    bar.hidden = false;
  }
}

/* `feld` is a parameter because the same question is asked in two places: in
   the settings, where somebody is tidying up, and in the start dialog, where
   somebody has just installed the program and their trees are already
   somewhere.  The second one only ever points - moving on a first start would
   move a folder the person has not even seen yet. */
/* ---- what did somebody just point at? ------------------------------------
   Asked while they type, so the dialog can say "data folder with three trees"
   before anything is pressed.  A person knows where their family is; which of
   three nested folders the program calls the data folder is the program's
   distinction, and it can work that out itself. */
let pruefLauf = null;

/* The Windows folder dialog, asked for by the program rather than by the page:
   a browser hands over a file's bytes and never its path, and a folder has no
   bytes at all.  The typed field stays beside it - a path pasted out of an
   Explorer address bar is often the quicker way, and this has to work on a
   machine where the dialog cannot open. */
async function ordnerWaehlen(feld, anzeige){
  const field = document.getElementById(feld);
  if(!field) return;
  try{
    const out = await api("/api/waehle-ordner?k=" + encodeURIComponent(EDIT.token),
                          {start: field.value.trim()});
    if(!out.pfad) return;                      // cancelled - leave the field alone
    field.value = out.pfad;
    const wohin = anzeige ? document.getElementById(anzeige) : null;
    const erkannt = out.erkannt || {};
    if(wohin){
      const teile = [erkannt.hinweis || ""];
      if(erkannt.ordner && erkannt.ordner !== erkannt.gefragt)
        teile.push("Benutzt wird: " + erkannt.ordner);
      wohin.textContent = teile.filter(Boolean).join("  —  ");
      wohin.dataset.art = erkannt.art || "";
    }
    if(feld === "importOrdner") zeigeFunde(erkannt);
  }catch(err){ say("Der Ordner-Dialog ging nicht auf – " + err.message, true); }
}

async function pruefeOrdner(feld, anzeige, dann){
  const field = document.getElementById(feld);
  const wohin = document.getElementById(anzeige);
  if(!field || !wohin) return;
  const wanted = field.value.trim();
  if(!wanted){ wohin.textContent = ""; if(dann) dann(null); return; }
  clearTimeout(pruefLauf);
  pruefLauf = setTimeout(async () => {
    try{
      const out = await api("/api/pruefen?k=" + encodeURIComponent(EDIT.token),
                            {pfad: wanted});
      const e = out.erkannt || {};
      const teile = [e.hinweis || ""];
      if(e.ordner && e.ordner !== e.gefragt) teile.push("Benutzt wird: " + e.ordner);
      // Named by family rather than by folder wherever the trees have been
      // read; the folder name is what the list below already says.
      if(!dann && (e.baeume || []).length) teile.push("Gefunden: " + e.baeume.join(" · "));
      wohin.textContent = teile.filter(Boolean).join("  —  ");
      wohin.dataset.art = e.art || "";
      if(dann) dann(e);
    }catch(_){ wohin.textContent = ""; if(dann) dann(null); }
  }, 250);
}

function setImportQuelle(which){

/* What a folder holds, listed by family name rather than by folder name: the
   folder is called whatever its owner called it, and that is precisely why the
   program stopped going by the name.

   This also decides which of the two answers is offered first, because the
   right one follows from what was pointed at.  A whole data folder is somebody
   putting an installation back and wants pointing at.  A single tree is
   somebody handing over one family and wants copying - pointing at one tree
   cannot mean "only this one", because a tree folder is not a data folder and
   the program would take the folder above it, neighbours and all.  That is
   said out loud rather than left to be discovered. */
function zeigeFunde(erkannt){
  const liste = document.getElementById("importFunde");
  const wahl = document.getElementById("ordnerMode");
  const warnung = document.getElementById("importWarnung");
  if(!liste) return;
  const drin = (erkannt && erkannt.inhalt) || [];
  liste.hidden = !drin.length;
  liste.innerHTML = drin.map(t => `<li><b>${esc(t.titel)}</b><small>${
    t.personen} ${t.personen === 1 ? "Person" : "Personen"} · Ordner ${esc(t.ordner)}</small></li>`).join("");

  const einzeln = erkannt && erkannt.art === "baum";
  if(wahl && erkannt && !wahl.dataset.vonHand)
    wahl.value = einzeln ? "kopieren" : "zeigen";
  if(warnung){
    const nachbarn = einzeln ? Math.max(0, (erkannt.baeume || []).length - 1) : 0;
    warnung.hidden = !(einzeln && wahl && wahl.value === "zeigen");
    warnung.innerHTML = nachbarn
      ? `<b>Achtung:</b> Ein einzelner Stammbaum kann kein Datenordner sein. Bei
         <b>Dorthin zeigen</b> wird der Ordner <b>darüber</b> genommen – ${
           nachbarn === 1
             ? "und der Stammbaum, der noch darin liegt, ist dann ebenfalls da"
             : "und die " + nachbarn + " weiteren Stammbäume darin sind dann ebenfalls da"}.
         Willst du wirklich nur diesen einen: <b>Hierher kopieren</b>.`
      : `<b>Achtung:</b> Ein einzelner Stammbaum kann kein Datenordner sein. Bei
         <b>Dorthin zeigen</b> wird der Ordner <b>darüber</b> genommen.`;
  }
}

async function runExport(){
  const on = id => {
    const el = document.getElementById(id);
    return !!el && el.checked && !el.disabled;
  };
  const formats = ["pdf", "html", "svg", "png", "baum", "gedcom"].filter(f =>
    on("fmt" + f[0].toUpperCase() + f.slice(1)));
  const wantDiagram = on("expDiagram"), wantBook = on("expBook");
  // the two data formats are the whole tree by definition, so the question of
  // diagram or book does not apply to them
  const onlyData = formats.every(f => f === "baum" || f === "gedcom");

  if(!formats.length) return say("Kein Format angehakt.", true);
  if(!onlyData && !wantDiagram && !wantBook) return say("Weder Diagramm noch Buch angehakt.", true);

  const fields = {};
  for(const [key] of EXPORT_FIELDS) fields[key] = on("feld_" + key);

  const button = document.getElementById("doExport");
  const info = document.getElementById("expInfo");
  button.disabled = true;
  button.textContent = "Schreibt …";

  try{
    let svg = null, png = null;
    if(wantDiagram && (formats.includes("svg") || formats.includes("png") || formats.includes("pdf"))){
      if(info) info.textContent = "Zeichnet das Diagramm …";
      svg = diagramSVG();
      const size = pngPossible();
      if(formats.includes("png") && size.ok){
        if(info) info.textContent = "Rechnet das Bild …";
        png = await svgToPNG(svg, size.w, size.h);
      }
    }
    if(info) info.textContent = "Schreibt die Dateien …";
    const out = await api("/api/export?k=" + encodeURIComponent(EDIT.token), {
      diagramm: wantDiagram, buch: wantBook,
      formate: formats, felder: fields,
      zusammen: on("pdfTogether"),
      ansicht: mode, mittelpunkt: centre,
      // whom the open view actually puts on the stage.  Without this the book
      // and the page were written out of the whole tree while the diagram
      // beside them showed a handful of people - see `only` in export.py
      personen: [...stageSet()],
      svg, png,
    });
    // The dialog stays and turns into the result: reading four long file names
    // out of a notification that disappears again is no way to check anything.
    const body = document.querySelector(".sheet-body");
    const foot = document.querySelector(".sheet-foot");
    if(body) body.innerHTML = `<div class="sec"><h3>Geschrieben</h3>
      <div class="stack">${out.dateien.map(name => `<div class="docrow">
        <span class="kind">✓</span><span>${esc(name)}</span><span></span></div>`).join("")}</div>
      <p class="hintline" style="margin-top:12px">Im Ordner <b>Export</b> neben dem Programm.</p></div>`;
    if(foot) foot.innerHTML = `<button class="btn primary" id="openFolder">Ordner öffnen</button>
      <button class="btn" data-close="1">Fertig</button><span class="grow"></span>`;
  }catch(err){
    say("Nicht geschrieben – " + err.message, true);
    button.disabled = false;
    button.textContent = "Schreiben";
    if(info) info.textContent = "Landet im Ordner Export";
  }
}

let umzugGefragt = false;

/* ---- editor wiring ------------------------------------------------------- */
/* All of it is delegated off `document`, because the form is thrown away and
   rebuilt whenever a block is added or a person is linked - anything bound to
   a single element would be gone after the first click. */
if(EDIT){
  document.documentElement.setAttribute("data-edit", "1");

  /* The program has no other way of knowing that its window is gone: Edge
     hands the window to a process of its own, so there is nothing to wait for
     on that side.  This is that signal - and it is a connection rather than a
     timer on purpose.  A timer was the first attempt, and browsers slow timers
     down to once a minute in a window that has been in the background a while,
     which shut the program down while its own window was still on screen. An
     open connection cannot be slowed down; when the window goes, it goes. */
  (function stayConnected(){
    const line = new EventSource("/api/anwesend?k=" + encodeURIComponent(EDIT.token));
    let broken = 0;
    line.onopen = () => {
      clearTimeout(broken);
      const bar = document.getElementById("abriss");
      if(bar) bar.remove();
    };
    // EventSource reconnects by itself, which is what is wanted when a laptop
    // wakes up again - so a drop is only reported once it has failed to come
    // back, not the moment it happens
    line.onerror = () => {
      clearTimeout(broken);
      broken = setTimeout(showBrokenBar, 6000);
    };
  })();
  addEventListener("pagehide", () => {
    // sendBeacon still goes out while the window is being torn down
    navigator.sendBeacon("/api/bye?k=" + encodeURIComponent(EDIT.token));
  });

  document.getElementById("addBtn").addEventListener("click", () => openEditor(null));
  document.getElementById("mastTitle").addEventListener("click", showTrees);

  document.getElementById("importBtn").addEventListener("click", () => {
    if(!editGuard()) return;
    importFile = null;
    closeSheetHard();
    document.body.insertAdjacentHTML("beforeend", importHTML());
    document.body.style.overflow = "hidden";
    setImportQuelle("datei");
  });

  document.getElementById("exportBtn").addEventListener("click", () => {
    if(!editGuard()) return;
    closeSheetHard();
    document.body.insertAdjacentHTML("beforeend", exportHTML());
    document.body.style.overflow = "hidden";
  });

  document.getElementById("optionsBtn").addEventListener("click", () => {
    if(!editGuard()) return;
    closeSheetHard();
    document.body.insertAdjacentHTML("beforeend", optionsHTML());
    document.body.style.overflow = "hidden";
  });

  document.addEventListener("input", e => {
    const pick = e.target.closest(".pickinput");
    if(pick){ openMenu(pick.closest(".picker")); return; }
    if(e.target.id === "dataDir"){ pruefeOrdner("dataDir", "dataDirErkannt"); return; }
    if(e.target.id === "startOrdner"){ pruefeOrdner("startOrdner", "startErkannt"); return; }
    if(e.target.id === "importOrdner"){
      pruefeOrdner("importOrdner", "importErkannt", zeigeFunde); return; }
    const field = e.target.closest("[data-k]");
    if(!field || !draft || !field.closest("#editForm")) return;
    setPath(draft, field.dataset.k, readInput(field));
    markDirty(true);
    if(["given", "surname", "name"].includes(field.dataset.k)){
      const head = document.getElementById("editTitle");
      if(head) head.textContent = (draft.name || (draft.given + " " + draft.surname).trim()) || "Ohne Namen";
    }
  });

  document.addEventListener("focusin", e => {
    const pick = e.target.closest(".pickinput");
    if(pick) openMenu(pick.closest(".picker"));
  });

  // Once somebody has answered the question themselves, the recognition stops
  // answering it for them - a suggestion that keeps overriding a choice is not
  // a suggestion.
  // The four group boxes in the link dialog. Re-asked on every change,
  // because who travels is the server's answer, not the page's guess.
  document.addEventListener("change", e => {
    const box = e.target.closest("[data-linkgruppe]");
    if(!box || !linkDraft) return;
    const id = box.dataset.linkgruppe;
    linkDraft.gruppen = box.checked
      ? linkDraft.gruppen.concat([id]).filter((v, i, a) => a.indexOf(v) === i)
      : linkDraft.gruppen.filter(g => g !== id);
    refreshLinkPreview();
  });

  document.addEventListener("change", e => {
    if(e.target.id !== "ordnerMode") return;
    e.target.dataset.vonHand = "1";
    const warnung = document.getElementById("importWarnung");
    if(warnung && e.target.value !== "zeigen") warnung.hidden = true;
    else pruefeOrdner("importOrdner", "importErkannt", zeigeFunde);
  });

  document.addEventListener("click", e => {
    const edit = e.target.closest("[data-edit-person]");
    if(edit){ openEditor(+edit.dataset.editPerson); return; }

    /* ---- linking ---- */
    const linkOpen = e.target.closest("[data-linkopen]");
    if(linkOpen){ openLinkDialog(+linkOpen.dataset.linkopen); return; }
    const linkZiel = e.target.closest("[data-linkziel]");
    if(linkZiel && linkDraft){
      linkDraft.ziel = linkZiel.dataset.linkziel;
      linkDraft.bekannt = [];
      refreshLinkPreview();
      return;
    }
    const jump = e.target.closest("[data-linkjump]");
    if(jump){
      const [slug, id] = jump.dataset.linkjump.split(":");
      jumpToTree(slug, +id);
      return;
    }
    if(e.target.closest("#linkNeuerBaum")){ neuerBaumFuerLink(); return; }
    if(e.target.closest("#linkGo")){ runLink(); return; }
    if(e.target.closest("#linkHide")){ hideLinked(); return; }
    if(e.target.closest("#linkDrop")){ dropLinked(); return; }
    if(e.target.closest("#backToTree")){ jumpBack(); return; }

    const pick = e.target.closest("[data-tree]");
    if(pick && !pick.disabled){ switchTree(pick.dataset.tree); return; }
    if(e.target.closest("#newTree")){ newTree(); return; }
    if(e.target.closest("#uebungsbaum")){ makeUebungsbaum(); return; }
    if(e.target.closest("#saveTreeName")){ renameTree(); return; }
    if(e.target.closest("#dropTree")){ dropTree(); return; }
    if(e.target.closest("#moveData")){ setDataDir(true); return; }
    if(e.target.closest("#pointData")){ setDataDir(false); return; }
    if(e.target.closest("#fromFile")){ document.getElementById("importBtn").click(); return; }
    if(e.target.closest("#doExport")){ runExport(); return; }
    if(e.target.closest("#doImport")){ runImport(); return; }
    if(e.target.closest("#afterImport")){ location.reload(); return; }
    if(e.target.closest("#pickImport")){
      pickFile().then(file => {
        if(!file) return;
        importFile = file;
        const where = document.getElementById("importName");
        if(where) where.textContent = file.name + " · " +
          (file.size / 1024 > 900 ? (file.size / 1048576).toFixed(1) + " MB"
                                  : Math.round(file.size / 1024) + " KB");
      });
      return;
    }
    const quelle = e.target.closest("[data-quelle]");
    if(quelle){ setImportQuelle(quelle.dataset.quelle); return; }
    const waehler = e.target.closest("[data-pick]");
    if(waehler){ ordnerWaehlen(waehler.dataset.pick, waehler.dataset.erkannt); return; }
    if(e.target.closest("#openData")){
      api("/api/open-folder?k=" + encodeURIComponent(EDIT.token), {was: "daten"})
        .catch(err => say(err.message, true));
      return;
    }
    if(e.target.closest("#checkUpdate")){
      const wohin = document.getElementById("optInfo");
      api("/api/updates?k=" + encodeURIComponent(EDIT.token))
        .then(() => { if(wohin) wohin.textContent = "Im Browser geöffnet."; })
        .catch(err => say("Ging nicht auf – " + err.message, true));
      return;
    }
    if(e.target.closest("#firstPerson")){ openEditor(null); return; }
    if(e.target.closest("#uebungsbaum")){ makeUebungsbaum(); return; }
    if(e.target.closest("#takeOver")){ takeOver(); return; }
    if(e.target.closest("#doUmzug")){ runUmzug(); return; }
    if(e.target.closest("#startZeigen")){ setDataDir(false, "startOrdner"); return; }
    if(e.target.closest("#openFolder")){
      api("/api/open-folder?k=" + encodeURIComponent(EDIT.token))
        .catch(err => say(err.message, true));
      return;
    }
    if(!e.target.closest(".picker")) closeMenus();
    if(!draft) return;

    const link = e.target.closest("[data-link]");
    if(link){
      const [role, id] = link.dataset.link.split(":");
      linkPerson(role, id);
      return;
    }
    const make = e.target.closest("[data-make]");
    if(make){
      const input = make.closest(".picker").querySelector(".pickinput");
      makePerson(make.dataset.make, input.value);
      return;
    }
    const unlink = e.target.closest("[data-unlink]");
    if(unlink){
      const [role, id] = unlink.dataset.unlink.split(":");
      unlinkPerson(role, id);
      return;
    }
    const add = e.target.closest("[data-add]");
    if(add){
      const key = add.dataset.add;
      draft[key] = draft[key] || [];
      draft[key].push(key === "events" ? {kind: "", with: []} : {});
      markDirty(true);
      renderForm();
      return;
    }
    const drop = e.target.closest("[data-drop]");
    if(drop){
      const [key, at] = drop.dataset.drop.split(":");
      (draft[key] || []).splice(+at, 1);
      markDirty(true);
      renderForm();
      return;
    }
    const dropDoc = e.target.closest("[data-dropdoc]");
    if(dropDoc){
      const at = +dropDoc.dataset.dropdoc;
      const doc = (draft.documents || [])[at];
      if(doc && confirm("„" + (doc.title || doc.file) + "“ von dieser Person lösen?\n\n" +
                        "Die Datei wird nicht gelöscht, sondern nach data/dokumente/_geloescht/ gelegt.")){
        api("/api/remove-file?k=" + encodeURIComponent(EDIT.token),
            {person: draft.id, file: doc.file}).catch(err => say(err.message, true));
        draft.documents.splice(at, 1);
        markDirty(true);
        renderForm();
      }
      return;
    }
    const up = e.target.closest("[data-upload]");
    if(up){ uploadFor(up.dataset.upload); return; }
    if(e.target.closest("[data-clearphoto]")){
      draft.photo = null;
      delete PHOTOS[draft.id];
      markDirty(true);
      renderForm();
      return;
    }
    if(e.target.closest("#doExport")){ runExport(); return; }
    if(e.target.closest("#saveBtn")){ saveDraft(); return; }
    if(e.target.closest("#dropPerson")){ removePerson(); return; }
    if(e.target.closest("#firstPerson")){ openEditor(null); return; }
    if(e.target.closest("#takeOver")){ takeOver(); return; }
  });

  // Escape closes the name dropdown first; only a second press asks about the
  // form itself, which the shared handler further up takes care of.
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && document.querySelector(".pickmenu")){
      closeMenus();
      e.stopImmediatePropagation();
    }
  }, true);
}

document.getElementById("hintDot").addEventListener("click", () =>
  document.getElementById("helpBtn").click());

/* The heading is the tree's own name, with its last word picked out -
   "Stammbaum Ihnen", "Familie Hemken", "Neuer Stammbaum".  Written here rather
   than in the markup because the program does not know whose tree it opens. */
(function nameThePage(){
  if(EDIT){
    // a heading that switches trees has to be reachable by keyboard too
    const head = document.getElementById("mastTitle");
    head.setAttribute("role", "button");
    head.setAttribute("tabindex", "0");
    head.title = "Stammbaum wechseln";
    head.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); head.click(); }
    });
  }
  const title = (DATA.meta.title || "Stammbaum").trim();
  const cut = title.lastIndexOf(" ");
  document.getElementById("mastTitle").innerHTML = cut > 0
    ? esc(title.slice(0, cut)) + " <em>" + esc(title.slice(cut + 1)) + "</em>"
    : "<em>" + esc(title) + "</em>";

  syncMe();
  // the view buttons start on "Alle" when there is nobody to be near to
  setMode(mode);

  const check = document.getElementById("checkBtn");
  if(check && !(DATA.checks && DATA.checks.length)) check.hidden = true;
})();

/* Läuft das hier aus einem Zweig, sagt es die Fensterleiste.  Zwei Fenster
   desselben Programms sehen sonst gleich aus, und nach dem dritten Wechsel
   weiß niemand mehr, welches den Umbau zeigt und welches den alten Stand. Die
   Kennung ist ein Fingerabdruck des Quelltextes: dieselben sieben Zeichen wie
   im Werkzeug, mit dem gearbeitet wird - stimmen sie überein, ist es derselbe
   Stand.  Im Hauptordner ist `EDIT.zweig` leer und hier passiert nichts. */
(function nameTheWindow(){
  const zw = EDIT && EDIT.zweig;
  if(!zw) return;
  document.title = "Stammbaum · " + zw.name + (zw.kennung ? " · " + zw.kennung : "");
})();

draw();

/* Last, because it may set a centre and redraw: if this page was reached by
   following a link, land on the person the link pointed at and offer the way
   back.  Does nothing at all on an ordinary open. */
if(IS_EDIT) applyJump();
</script>
</body>
</html>
