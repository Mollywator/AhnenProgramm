          <i class="${tag.cls}">${esc(tag.text)}</i>
          <u>${datesHTML(p)}</u>
        </span>
      </button>
      <button class="info" data-open="${id}" title="Personenblatt öffnen">Blatt</button>
      ${linkMarkHTML(p)}
      ${id === armed ? addsHTML(id, p) : ""}
    </div>`;
}

/* The mark in the bottom right corner of the box.  Deliberately the corner
   that is otherwise empty, and deliberately not a button: clicking a box means
   one thing - make this person the centre - and a second target inside it
   would make that gesture unreliable.  The sheet is where the link is acted
   on. */
function linkMarkHTML(p){
  if(!linkedElsewhere(p)) return "";
  const wo = otherTrees(p).map(t => treeTitle(t.slug)).join(" · ");
  return `<span class="linkmark" aria-hidden="true"
      title="Steht auch in: ${esc(wo)}">⧉</span>`;
}

/* The person the diagram is armed on: the box that was clicked last, and the
   only one wearing the four add buttons.  Reading only, there is nothing to
   add, so the whole thing stays out of the family's copy of the page. */
let armed = null;

function addsHTML(id, p){
  if(!IS_EDIT) return "";
  const first = (p.name || "").split(" ")[0] || "diese Person";
  const b = (dir, role, title) =>
    `<button class="add ${dir}" data-relnew="${role}:${id}" title="${esc(title)}">＋</button>`;
  return `<span class="adds">
    ${b("up", "parent", "Elternteil von " + first + " anlegen")}
    ${b("down", "child", "Kind von " + first + " anlegen")}
    ${b("left", "sibling", "Geschwister von " + first + " anlegen")}
    ${b("right", "sibling", "Geschwister von " + first + " anlegen")}
  </span>`;
}

/* Someone counts as no longer living when the report says so, and otherwise
   once they would be older than 110 - the usual genealogical presumption. */
function isGone(p){
  if(p.death) return true;
  const year = (p.birth || {}).year;
  return !!year && (new Date().getFullYear() - year) > 110;
}

function thumbHTML(p){
  const src = PHOTOS[p.id];
  return src
    ? `<img class="thumb" src="${src}" alt="" loading="lazy">`
    : `<span class="thumb mono">${esc(initials(p))}</span>`;
}

function shortDate(d){
  if(!d) return "";
  if(d.day && d.month && d.year) return d.day + "." + d.month + "." + d.year;
  if(d.month && d.year) return d.month + "/" + d.year;
  if(d.year) return (d.approx ? "um " : "") + d.year;
  return d.note ? "unbekannt" : "";
}

function datesHTML(p){
  const born = shortDate(p.birth);
  const died = p.death ? shortDate(p.death) : "";
  const out = [];
  if(born) out.push(`<span class="born">✶&nbsp;${esc(born)}</span>`);
  if(p.death) out.push(`<span class="died">†&nbsp;${esc(died || "unbekannt")}</span>`);
  return out.join(" ") || "<span class=\"born\">Lebensdaten unbekannt</span>";
}

function renderTree(){
  const centrePerson = centre === null ? null : BY_ID.get(centre);
  const people = stageSet();
  const {units, home} = buildUnits(people);
  assignGenerations(people, home);
  const groups = classify(people);
  let levels;
  if(mode === "ahnen"){
    ({levels} = layoutPedigree(units, home, people));
  } else {
    ({levels} = layoutUnits(units, home, people, groups));
    // two passes are enough to settle: order the couples, place again, order
    // once more in case the new positions changed anybody's mind
    for(let pass = 0; pass < 2; pass++){
      if(!orderCouples(units, home, people)) break;
      ({levels} = layoutUnits(units, home, people, groups));
    }
  }

  const minX = Math.min(...units.map(u => u.x));
  const maxX = Math.max(...units.map(u => u.x + u.w));
  const maxY = Math.max(...units.map(u => u.y)) + NH;
  const width = maxX - minX + PAD * 2, height = maxY + PAD * 2;
  const dx = PAD - minX, dy = PAD;

  const boxes = [], wires = [], hulls = [], bars = [];
  const hullBox = new Map();                 // clan id -> bounding box

  for(const unit of units){
    const y = unit.y + dy;
    for(const id of unit.ids){
      const x = boxX(unit, id) + dx;
      const rel = id === centre ? null : relation(centre, id);
      const kind = groups.kind.get(id) || "indirekt";
      const classes = [
        id === centre ? "centre" : "",
        kind,
        kind === "blut" && rel
          ? ({auf: "up", ab: "down", geschwister: "side", seitlich: "side", cousin: "side"}[rel.kind] || "")
          : "",
      ].filter(Boolean).join(" ");
      const tag = id === centre
        ? {text: "Mittelpunkt", cls: "rel"}
        : rel ? {text: rel.label, cls: "rel"}
              : {text: lifespan(BY_ID.get(id)) || "—", cls: ""};
      boxes.push(boxHTML(id, x, y, classes, tag));

      const clan = groups.clanOf.get(id);
      if(clan){
        const b = hullBox.get(clan) || {x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity};
        b.x0 = Math.min(b.x0, x); b.y0 = Math.min(b.y0, y);
        b.x1 = Math.max(b.x1, x + NW); b.y1 = Math.max(b.y1, y + NH);
        hullBox.set(clan, b);
      }
    }
    for(let i = 1; i < unit.ids.length; i++){
      const x1 = boxX(unit, unit.ids[i - 1]) + dx + NW;
      const x2 = boxX(unit, unit.ids[i]) + dx;
      const mixed = groups.kind.get(unit.ids[i - 1]) !== groups.kind.get(unit.ids[i]);
      const cls = mixed ? "marriage bridge" : "marriage";
      const kin = ` data-kin="${unit.ids[i - 1]} ${unit.ids[i]}"`;
      wires.push(`<path class="${cls}"${kin} d="M${x1} ${y + NH / 2 - 2} H${x2}"/>`);
      wires.push(`<path class="${cls}"${kin} d="M${x1} ${y + NH / 2 + 2} H${x2}"/>`);
    }
    /* The sibling bar is collected here and drawn further down, once every bar
       of this generation is known and each can be given its own lane. */
    const drops = new Map();
    for(const child of unit.childUnits){
      const kid = child.ids.find(i => BY_ID.get(i).parents.some(p => unit.ids.includes(p)));
      const kidId = kid === undefined ? child.main : kid;
      const from = BY_ID.get(kidId).parents.filter(p => unit.ids.includes(p));
      const anchor = from.length
        ? from.reduce((a, p) => a + boxX(unit, p) + NW / 2, 0) / from.length + dx
        : unit.x + unit.w / 2 + dx;
      const key = Math.round(anchor);
      if(!drops.has(key)) drops.set(key, []);
      drops.get(key).push({x: boxX(child, kidId) + dx + NW / 2, y: child.y + dy,
                           id: kidId,
                           lit: child.ids.includes(centre) || unit.ids.includes(centre),
                           far: Math.abs(boxX(child, kidId) + dx + NW / 2 - anchor) > 900});
    }
    for(const [anchor, kids] of drops)
      bars.push({gen: unit.gen, top: y + NH, anchor, kids,
                 kin: unit.ids.concat(kids.map(k => k.id)),
                 lit: kids.some(k => k.lit),
                 far: kids.some(k => k.far),
                 x0: Math.min(anchor, ...kids.map(k => k.x)),
                 x1: Math.max(anchor, ...kids.map(k => k.x))});
  }

  /* Every sibling bar gets a lane of its own, so two families never share one
     horizontal line.  Bars that do not overlap sideways can reuse a lane. */
  const byGen = new Map();
  for(const bar of bars){
    if(!byGen.has(bar.gen)) byGen.set(bar.gen, []);
    byGen.get(bar.gen).push(bar);
  }
  for(const list of byGen.values()){
    list.sort((a, b) => a.x0 - b.x0);
    const ends = [];
    for(const bar of list){
      let lane = ends.findIndex(e => e < bar.x0 - 30);
      if(lane === -1){ lane = ends.length; }
      ends[lane] = bar.x1;
      bar.lane = lane;
    }
    const room = ROW_GAP - NH - LANE_TOP - 10;
    const lanes = Math.max(1, Math.floor(room / LANE_STEP));
    for(const bar of list) bar.y = bar.top + LANE_TOP + (bar.lane % lanes) * LANE_STEP;
  }

  /* Anywhere a bar has to cross somebody else's vertical line it hops over it,
     the way a wiring diagram does, so the two can be told apart. */
  const posts = [];
  for(const bar of bars){
    posts.push({gen: bar.gen, x: bar.anchor, y0: bar.top, y1: bar.y, bar});
    for(const kid of bar.kids) posts.push({gen: bar.gen, x: kid.x, y0: bar.y, y1: kid.y, bar});
  }
  for(const bar of bars){
    const cls = [bar.lit ? "lit" : "", bar.far ? "far" : ""].filter(Boolean).join(" ");
    const kin = ` data-kin="${bar.kin.join(" ")}"`;
    wires.push(`<path${cls ? ` class="${cls}"` : ""}${kin} d="M${bar.anchor} ${bar.top} V${bar.y}"/>`);
    for(const kid of bar.kids)
      wires.push(`<path${cls ? ` class="${cls}"` : ""}${kin} d="M${kid.x} ${bar.y} V${kid.y}"/>`);
    const hops = posts
      .filter(p => p.bar !== bar && p.gen === bar.gen
                && p.x > bar.x0 + HOP && p.x < bar.x1 - HOP
                && p.y0 < bar.y - 0.5 && p.y1 > bar.y + 0.5)
      .map(p => p.x)
      .sort((a, b) => a - b);
    let d = `M${bar.x0} ${bar.y}`;
    let last = bar.x0;
    for(const x of hops){
      if(x - HOP <= last) continue;
      d += ` H${round1(x - HOP)} A${HOP} ${HOP} 0 0 1 ${round1(x + HOP)} ${bar.y}`;
      last = x + HOP;
    }
    d += ` H${bar.x1}`;
    wires.push(`<path${cls ? ` class="${cls}"` : ""}${kin} d="${d}"/>`);
  }

  if(design === "sippen"){
    for(const clan of groups.clans){
      const b = hullBox.get(clan.id);
      if(!b || !clan.members.length) continue;
      const pad = 22;
      const label = clan.bridge !== null
        ? `Familie ${clan.name} · über ${BY_ID.get(clan.bridge).name.split(" ")[0]}`
        : `Familie ${clan.name}`;
      hulls.push(`<div class="hull" style="left:${b.x0 - pad}px;top:${b.y0 - pad - 16}px;
        width:${b.x1 - b.x0 + pad * 2}px;height:${b.y1 - b.y0 + pad * 2 + 16}px">
        <span class="hull-label">${esc(label)}</span></div>`);
    }
  }

  /* The generation names are somebody's - "Eltern", "Enkel" only mean
     anything measured from a person.  With nobody in the middle the rail stays
     empty rather than saying something untrue. */
  const tiers = [];
  for(const g of (centrePerson ? levels : [])){
    const label = g === 0 ? "Generation " + centrePerson.name.split(" ")[0]
      : g < 0 ? (g === -1 ? "Eltern" : g === -2 ? "Großeltern" : g === -3 ? "Urgroßeltern"
                 : (-g - 2) + "× Urgroßeltern")
      : (g === 1 ? "Kinder" : g === 2 ? "Enkel" : g === 3 ? "Urenkel" : (g - 2) + "× Urenkel");
    tiers.push({y: (g - levels[0]) * ROW_GAP + dy - 20, label});
  }
  document.getElementById("rail").innerHTML =
    tiers.map(t => `<div class="tier" data-y="${t.y}">${esc(t.label)}</div>`).join("");

  const plane = document.getElementById("plane");
  plane.style.width = width + "px";
  plane.style.height = height + "px";
  plane.dataset.design = design;
  plane.innerHTML =
    `<svg class="wires" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${wires.join("")}</svg>` +
    hulls.join("") + boxes.join("");

  const counts = {blut: 0, heirat: 0, indirekt: 0, neutral: 0};
  for(const id of people) counts[groups.kind.get(id) || "indirekt"]++;
  // A dash, not a nought: nothing has been counted, rather than none found.
  document.getElementById("cBlut").textContent = centrePerson ? counts.blut : "–";
  document.getElementById("cHeirat").textContent = centrePerson ? counts.heirat : "–";
  document.getElementById("cIndirekt").textContent = centrePerson ? counts.indirekt : "–";

  /* The linked entry earns its place in the legend only where there is
     something to explain: a tree with no links shows the same four items it
     always did, and the mark never appears without its key. */
  let linked = 0;
  for(const id of people) if(linkedElsewhere(BY_ID.get(id))) linked++;
  const legendLinked = document.getElementById("legendLinked");
  if(legendLinked){
    legendLinked.hidden = linked === 0;
    document.getElementById("cLinked").textContent = linked || "";
  }

  document.getElementById("who").innerHTML = centrePerson
    ? `<b>${esc(centrePerson.name)}</b><span>${esc(lifespan(centrePerson) || "Lebensdaten unbekannt")}` +
      `${centrePerson.relation ? " · " + esc(centrePerson.relation) : ""}</span>`
    : `<b>Der ganze Baum</b><span>Kein Mittelpunkt gewählt – ein Klick auf einen Kasten genügt</span>`;
  document.getElementById("sub").textContent =
    DATA.meta.count + " Personen · " + DATA.meta.photos + " Portraits" +
    (centrePerson ? " · Mittelpunkt: " + centrePerson.name : "");
  document.getElementById("legendCount").textContent =
    people.size + " von " + DATA.meta.count + " Personen im Bild";

  applyScale();
  requestAnimationFrame(settleView);
}

const round1 = n => Math.round(n * 10) / 10;

function byBirth(a, b){
  const ya = ((BY_ID.get(a) || {}).birth || {}).year || 9999;
  const yb = ((BY_ID.get(b) || {}).birth || {}).year || 9999;
  return ya - yb || a - b;
}

/* ---- zoom and pan -------------------------------------------------------- */
/* The diagram is moved with a transform rather than the stage's scrollbars, so
   it can be dragged freely in every direction instead of stopping at an edge. */
let view = {scale: 1, x: 0, y: 0};
const MIN_SCALE = 0.04, MAX_SCALE = 4;

/* Does this browser really lay out at a given `zoom`?  Asked by measuring, not
   by CSS.supports(), which has answered wrongly for `zoom` in the past. */
const ZOOM_METHOD = (function(){
  try{
    const probe = document.createElement("div");
    probe.style.cssText = "position:absolute;left:-9999px;top:0;width:100px;height:10px;zoom:2";
    document.body.appendChild(probe);
    const wide = probe.getBoundingClientRect().width;
    probe.remove();
    return Math.abs(wide - 200) < 1 ? "layout" : "bild";
  }catch(_){ return "bild"; }
})();

/* Lays the diagram out at the zoom in force and moves it into place.  The zoom
   is a layout property, so the boxes are set and the type and portraits drawn
   at their true size - nothing is ever a stretched picture, not even while the
   wheel is turning.  Panning is a translate and never stretches either. */
function paint(){
  const pan = document.getElementById("pan");
  const plane = document.getElementById("plane");
  if(ZOOM_METHOD === "layout") plane.style.zoom = view.scale;
  else plane.style.transform = "scale(" + view.scale + ")";
  pan.style.transform = "translate(" + view.x + "px," + view.y + "px)";
  plane.classList.toggle("tiny", view.scale < 0.62 && view.scale >= 0.3);
  plane.classList.toggle("micro", view.scale < 0.3);
  syncRail();
}

function applyScale(){
  const dpr = window.devicePixelRatio || 1;
  view.x = Math.round(view.x * dpr) / dpr;   // land on whole device pixels
  view.y = Math.round(view.y * dpr) / dpr;
  paint();
}
function syncRail(){
  const stage = document.getElementById("stage");
  const rail = document.getElementById("rail");
  if(!rail) return;
  for(const tier of rail.children){
    const y = (+tier.dataset.y) * view.scale + view.y;
    tier.style.top = y + "px";
    tier.style.opacity = (y < -12 || y > stage.clientHeight - 4) ? "0" : "1";
  }
}
function centreView(){
  const stage = document.getElementById("stage");
  const marked = document.getElementById("plane").querySelector(".box.centre");
  // Nothing marked means nobody has picked yet: show the whole tree rather
  // than leaving the reader wherever the last draw happened to end.
  if(!marked) return fitToCentre();
  const left = RAIL_W;
  view.x = left + (stage.clientWidth - left) / 2
         - (parseFloat(marked.style.left) + NW / 2) * view.scale;
  view.y = stage.clientHeight / 2
         - (parseFloat(marked.style.top) + NH / 2) * view.scale;
  applyScale();
}
function fitToCentre(){
  const stage = document.getElementById("stage");
  const plane = document.getElementById("plane");
  const w = parseFloat(plane.style.width), h = parseFloat(plane.style.height);
  const room = Math.max(200, stage.clientWidth - RAIL_W - 20);
  view.scale = Math.max(MIN_SCALE, Math.min(1, room / w, (stage.clientHeight - 20) / h));
  view.x = RAIL_W + (room - w * view.scale) / 2;
  view.y = (stage.clientHeight - h * view.scale) / 2;
  applyScale();
}

/* Where the view is to stand once the tree has been drawn again.  Choosing a
   new middle lays every box out afresh, so leaving the camera alone would not
   hold anything still - the person under the pointer would slide away beneath
   it.  The box that was clicked is pinned to the screen spot it already
   occupied instead: the diagram rearranges itself around a fixed point, the
   reader keeps their bearings, and a relative added with "+" turns up next to
   the box it was added from rather than somewhere that has to be looked for. */
let anchor = null;

/* Notes where a box sits on screen, but only while it really is on screen:
   pinning a box outside the window would hold the view on empty paper. */
function holdInPlace(id){
  anchor = null;
  if(id === null || id === undefined) return;
  const box = document.querySelector('.box[data-person="' + id + '"]');
  if(!box) return;
  const stage = document.getElementById("stage");
  const sx = (parseFloat(box.style.left) + NW / 2) * view.scale + view.x;
  const sy = (parseFloat(box.style.top) + NH / 2) * view.scale + view.y;
  if(sx < RAIL_W || sx > stage.clientWidth || sy < 0 || sy > stage.clientHeight) return;
  anchor = {id, sx, sy};
}

/* Puts the held box back under the same screen point.  The scale may have
   changed in between - the first pick switches to the near view - so the box
   centre is measured, not its corner, and the person grows in place. */
function restoreAnchor(){
  const held = anchor;
  anchor = null;
  const box = held && document.querySelector('.box[data-person="' + held.id + '"]');
  // Gone from the drawing altogether: centring is then the only way to leave
  // the reader looking at something.
  if(!box) return centreView();
  view.x = held.sx - (parseFloat(box.style.left) + NW / 2) * view.scale;
  view.y = held.sy - (parseFloat(box.style.top) + NH / 2) * view.scale;
  applyScale();
}

/* One place decides where a fresh drawing leaves the view: on the held box if
   there is one, on the middle otherwise. */
function settleView(){
  if(anchor) restoreAnchor();
  else centreView();
}
/* Switching views happens in two places - the buttons, and the moment the
   first centre is picked - so the whole switch lives in one function. */
function setMode(next){
  mode = next;
  document.querySelectorAll("#modes .btn[data-mode]").forEach(o =>
    o.setAttribute("aria-pressed", String(o.dataset.mode === next)));
  // The "verknüpfte mit anzeigen" switch belongs to the view it changes, so it
  // is on screen exactly while that view is.
  const alleMenu = document.getElementById("alleMenu");
  if(alleMenu) alleMenu.hidden = next !== "alle";
  // A fifteen generation tree cannot be read whole, so the big views start at
  // a legible zoom around the centre; "Einpassen" gives the bird's eye view.
  view.scale = next === "nah" ? 1 : next === "ahnen" ? 0.8 : 0.7;
}

function zoomBy(factor, cx, cy){
  const stage = document.getElementById("stage");
  const before = view.scale;
  view.scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * factor));
  const ax = cx === undefined ? stage.clientWidth / 2 : cx;
  const ay = cy === undefined ? stage.clientHeight / 2 : cy;
  // keep the point under the cursor where it was
  view.x = ax - (ax - view.x) * (view.scale / before);
  view.y = ay - (ay - view.y) * (view.scale / before);
  applyScale();
}

/* ----------------------------------------------------------------- detail */
/* The note under the sheet's own buttons: this person is kept in a second
   tree, and that is where her family stands.  In the program the tree name is
   the button - one click and you are over there, on her.  In the file handed
   to the family it is a footnote mark and a line at the bottom instead, which
   is the form that also survives being printed. */
function linkNoteHTML(p){
  const wo = otherTrees(p);
  if(!wo.length) return "";
  if(IS_EDIT) return `<p class="hintline" style="margin-top:10px;max-width:44ch">
    <span aria-hidden="true">⧉</span> Wird auch geführt in
    ${wo.map(t => `<button type="button" class="plink" style="display:inline;padding:0 2px;border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer" data-linkjump="${esc(t.slug)}:${t.id}">${esc(treeTitle(t.slug))}</button>`).join(" · ")}
    – dort steht die eigene Familie.</p>`;
  return `<p class="hintline" style="margin-top:10px;max-width:44ch">
    <span class="fn">*${footnoteNo(p)}</span> Hat einen eigenen Stammbaum.</p>`;
}

/* The footnote numbers in the read-only file: counted per page load, in the
   order the sheets are opened, so the mark in a box and the line at the foot
   of the page always say the same number. */
const footnotes = new Map();
function footnoteNo(p){
  const l = linkOf(p);
  const key = (l && l.uid) || ("id" + p.id);
  if(!footnotes.has(key)) footnotes.set(key, footnotes.size + 1);
  return footnotes.get(key);
}

function sheetHTML(p){
  const rel = anyRelation(centre, p.id);
  const path = centre === null ? null : relationPath(centre, p.id);
  const centrePerson = centre === null ? null : BY_ID.get(centre);

  const linkList = ids => ids.map(i => BY_ID.get(i)).filter(Boolean).map(q =>
    `<button class="plink" data-open="${q.id}">${esc(q.name)}<small>${esc(lifespan(q) || "")}</small></button>`).join("") ;

  const sections = [];

  if(centrePerson && p.id !== centre && rel){
    sections.push(`<div class="sec">
      <h3>Verhältnis zu ${esc(centrePerson.name)}</h3>
      <p class="prose"><em>${esc(p.name)}</em> ist ${esc(rel.label)} von <em>${esc(centrePerson.name)}</em>.</p>
      ${path && path.length ? `<ul class="path" style="margin-top:12px">
        <li><b>${esc(centrePerson.name)}</b><span>Mittelpunkt</span></li>
        ${path.map(s => `<li><b>${esc(BY_ID.get(s.id).name)}</b><span>${esc(s.step)}</span></li>`).join("")}
      </ul>` : ""}
    </div>`);
  }

  const facts = [];
  if(p.title) facts.push(["Titel", p.title]);
  if(p.call_name) facts.push(["Rufname", p.call_name]);
  if(p.birth_name) facts.push(["Geburtsname", p.birth_name]);
  if(p.birth) facts.push(["Geboren", fullEvent(p.birth)]);
  if(p.death) facts.push(["Gestorben", fullEvent(p.death) || p.death.note || ""]);
  if(p.death && p.death.cause) facts.push(["Todesursache", p.death.cause]);
  if(p.burial) facts.push(["Beerdigt", fullEvent(p.burial)]);
  if(p.occupation) facts.push(["Beruf", p.occupation]);
  if(p.religion) facts.push(["Konfession", p.religion]);
  if(p.relation) facts.push(["Im Bericht geführt als", p.relation]);
  if(p.tree) facts.push(["Stammbaum im Bericht", "Nr. " + p.tree]);
  facts.push([p.id >= 1001 ? "Nummer (selbst angelegt)" : "Nummer im Bericht", "#" + p.id]);
  if(facts.some(f => f[1])) sections.push(`<div class="sec"><h3>Eckdaten</h3>
    <dl class="kv">${facts.filter(f => f[1]).map(f =>
      `<div class="fact"><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join("")}</dl></div>`);

  if(p.parents.length) sections.push(`<div class="sec"><h3>Eltern</h3><div class="people-links">${linkList(p.parents)}</div></div>`);
  if(p.spouses.length) sections.push(`<div class="sec"><h3>Ehe und Partnerschaft</h3><div class="people-links">${linkList(p.spouses)}</div></div>`);
  if(p.children.length) sections.push(`<div class="sec"><h3>Kinder</h3><div class="people-links">${linkList(p.children)}</div></div>`);

  if(p.residences && p.residences.length) sections.push(`<div class="sec"><h3>Wohnorte</h3>
    <ul class="timeline">${p.residences.map(r => `<li>
      <span class="yr">${esc([r.from, r.to].filter(Boolean).join("–") || "—")}</span>
      <span class="what">${esc(r.place || "")}</span>
      <span class="where">${esc([r.address, r.note].filter(Boolean).join(" · "))}</span>
    </li>`).join("")}</ul></div>`);

  const sibs = [];
  for(const parent of p.parents) for(const c of (BY_ID.get(parent) || {children: []}).children)
    if(c !== p.id && !sibs.includes(c)) sibs.push(c);
  if(sibs.length) sections.push(`<div class="sec"><h3>Geschwister</h3><div class="people-links">${linkList(sibs)}</div></div>`);

  if(p.events.length){
    // hand added stations land at the end of the list, so the reading view
    // sorts a copy rather than showing 1964 after 2019
    const story = p.events.slice().sort((a, b) => (a.year || 9999) - (b.year || 9999));
    sections.push(`<div class="sec"><h3>Lebenslauf</h3>
    <ul class="timeline">${story.map(e => `<li>
      <span class="yr">${e.year ? (e.approx ? "um " : "") + e.year : "—"}</span>
      <span class="what">${esc(e.kind)}</span>
      <span class="where">${esc([dateText({day: e.day, month: e.month}), e.place].filter(Boolean).join(" · ") ||
        (e.with && e.with.length ? "mit " + e.with.map(i => (BY_ID.get(i) || {}).name).filter(Boolean).join(", ") : ""))}${
        e.text ? `<span style="display:block;color:var(--ink-3);font-size:14.5px;margin-top:2px">${esc(e.text)}</span>` : ""}</span>
    </li>`).join("")}</ul></div>`);
  }

  if(p.notes && p.notes.length) sections.push(`<div class="sec"><h3>Notizen</h3>
    ${p.notes.map(n => `<p class="note">${esc(n)}</p>`).join("")}</div>`);

  if(p.extra) sections.push(`<div class="sec"><h3>Weitere Angaben</h3><p class="prose">${esc(p.extra)}</p></div>`);

  if(p.freetext) sections.push(`<div class="sec"><h3>Eigene Notizen</h3>
    <p class="prose" style="white-space:pre-wrap">${esc(p.freetext)}</p></div>`);

  // The scans themselves only exist while the edit program is running.  In the
  // file handed to the family the whole field is stripped out beforehand, so

  if(p.documents && p.documents.length) sections.push(`<div class="sec"><h3>Unterlagen</h3>
    <div class="stack">${p.documents.map(d => `<div class="docrow">
      <span class="kind">▤</span>
      <span>${EDIT ? `<a href="/datei/${p.id}/${encodeURIComponent(d.file)}" target="_blank" rel="noopener">${esc(d.title || d.file)}</a>`
                   : esc(d.title || d.file)}<small>${esc(d.file)}</small></span>
      <span></span></div>`).join("")}</div></div>`);

  if(p.contact && Object.values(p.contact).some(Boolean)){
    const rows = [["Telefon", p.contact.phone], ["Mobil", p.contact.mobile],
                  ["E-Mail", p.contact.email], ["Anschrift", p.contact.address]];
    sections.push(`<div class="sec"><h3>Kontakt</h3><dl class="kv">${rows.filter(r => r[1]).map(r =>
      `<div class="fact"><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl></div>`);
  }

  if(p.sources && p.sources.length) sections.push(`<div class="sec"><h3>Quellen</h3>
    <ul class="timeline">${p.sources.map(n => `<li style="grid-template-columns:62px minmax(0,1fr)">
      <span class="yr">Nr. ${n}</span>
      <span class="where">${esc(DATA.source_titles[n] || "—")}</span></li>`).join("")}</ul></div>`);

  if(p.bio) sections.push(`<div class="sec"><details class="raw">
    <summary>Originaltext aus dem Bericht</summary>
    <p class="prose">${esc(p.bio.replace(/\{(\d+)\}/g, (_, id) => ""))}</p>
    ${p.source_text ? `<p class="prose" style="margin-top:10px;font-size:13.5px;color:var(--ink-3)">${esc(p.source_text.replace(/\{(\d+)\}/g, ""))}</p>` : ""}
  </details></div>`);

  return `<div class="scrim" id="scrim">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(p.name)}">
      <div class="sheet-head">
        ${avatarHTML(p, "portrait")}
        <div>
          <div class="kicker">Personenblatt · Nr. ${p.id}</div>
          <h2>${esc(p.name)}</h2>
          <div class="node-meta" style="font-size:14px;margin-top:4px">${esc(lifespan(p) || "Lebensdaten unbekannt")}</div>
          ${centrePerson && p.id !== centre && rel
            ? `<div class="rel-badge">${esc(rel.label)} von ${esc(centrePerson.name.split(" ")[0])}</div>` : ""}
          <div class="centre-actions" style="margin-top:14px">
            ${p.id === centre ? "" : `<button class="btn primary" data-centre="${p.id}" data-close="1">Als Mittelpunkt setzen</button>`}
            ${p.id === ME
              ? `<button class="btn" data-me="0" data-close="1">Doch nicht ich</button>`
              : `<button class="btn" data-me="${p.id}" data-close="1">Das bin ich</button>`}
          </div>
          <p class="hintline" style="margin-top:8px;max-width:44ch">${p.id === ME
            ? "Der Baum öffnet bei dir und rechnet jede Verwandtschaft von dir aus."
            : (IS_EDIT
                ? "Merkt sich im Programm, wo du im Baum stehst."
                : "Merkt sich in diesem Browser, wo du im Baum stehst. An der Datei ändert sich nichts.")}</p>
          ${linkNoteHTML(p)}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:12px">
          <button class="closer" data-close="1" aria-label="Schließen">×</button>
          <button class="btn editonly" data-edit-person="${p.id}">Bearbeiten</button>
          <!-- Also here, not only one level down in the edit form.  This is
               where it was looked for: the sheet is where you go to ask "what
               about this person", and which trees carry her is that kind of
               question, not a field to be typed in. -->
          ${IS_EDIT ? linkButtonHTML(p) : ""}
        </div>
      </div>
      <div class="sheet-body">${sections.join("")}</div>
    </div>
  </div>`;
}

function openSheet(id){
  closeSheet();
  document.body.insertAdjacentHTML("beforeend", sheetHTML(BY_ID.get(id)));
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  // the editor refuses to be closed on top of unsaved work; in the read only
  // file `editGuard` is never defined and this costs nothing
  if(typeof editGuard === "function" && !editGuard()) return;
  const s = document.getElementById("scrim");
  if(s) s.remove();
  document.body.style.overflow = "";
}

function setCentre(id){
  const wasEmpty = centre === null;
  centre = id;
  // Clicking a box is also what arms its four add buttons - one gesture, so
  // that adding a relative never needs a mode to be switched on first.
  armed = id;
  // The first pick is also the first moment the near view means anything, so
  // the whole-tree opening hands over to it rather than staying zoomed out.
  if(wasEmpty && id !== null && mode === "alle") setMode("nah");
  syncMe();
  renderTree();
  renderList();
}

/* Clicking past the boxes puts the add buttons away.  Done by hand on the one
   box that carries them rather than by drawing the tree again - a click on
   empty space is not worth re-laying-out three hundred people. */
function disarm(){
  if(armed === null) return;
  armed = null;
  const held = document.querySelector(".box.armed");
  if(held){
    held.classList.remove("armed");
    const adds = held.querySelector(".adds");
    if(adds) adds.remove();
  }
}

/* "That is me."  In the editor this is the owner's own setting and is saved
   with the tree; in the copy the family gets it stays in the reader's browser,
   so two people can look at the same file and each stand in their own place. */
function setMe(id){
  ME = id;
  if(IS_EDIT){
    DATA.meta.root = id;
    api("/api/set-root?k=" + encodeURIComponent(EDIT.token), {id})
      .catch(err => say("Nicht gemerkt – " + err.message, true));
  } else {
    try{
      if(id === null) localStorage.removeItem(ME_KEY);
      else localStorage.setItem(ME_KEY, String(id));
    }catch(_){}                     // no storage: the choice holds for this visit only
  }
  if(id === null){ syncMe(); say("Gut – du bist wieder einer von vielen."); }
  else { setCentre(id); say("Gemerkt. Der Baum steht jetzt um dich herum."); }
}

/* The button in the header is the one permanent place to say where you stand:
   it offers the choice while there is none, and leads home once there is. */
function syncMe(){
  const btn = document.getElementById("rootBtn");
  if(!btn) return;
  const me = ME === null ? null : BY_ID.get(ME);
  // just the first name - a full "Zurück zu Detlev Volkmar Ihnen" is a mouthful
  btn.textContent = me ? "Zurück zu " + (me.given || me.name).trim().split(/\s+/)[0]
                       : "Das bin ich";
  btn.title = me
    ? "Springt zu dir zurück. Ändern geht im Personenblatt."
    : "Such dich links in der Liste und wähle im Personenblatt „Das bin ich“.";
  btn.hidden = !DATA.people.length;
}

/* ===================================================================== editor
   The page is read only unless `tools/edit_server.py` is serving it.  That
   server puts a `window.STAMMBAUM_EDIT` object into the head before this
   script runs; without it every line below stays dormant and the file behaves
   exactly as the one mailed around the family.

   Two rules run through all of it, and `tools/edits.py` follows the same ones
   on the Python side:

     * `parents` is the truth about descent and `children` is derived from it.
       So "give this person a child" is stored as a parent link on the child,
       and cutting a link from either end really cuts it.
     * `spouses` is symmetric and cannot be derived, so both records are
       written whenever a marriage is added or removed.

   Everything typed here goes to `data/edits.json`, never into `tree.json`,
   because `build_data.py` rewrites that file from the report PDF every time it
   runs and would take the handiwork with it. */

const EDIT = window.STAMMBAUM_EDIT || null;

/* Fields the report never fills in; a hand written person carries them too so
   that every record in the tree has the same shape.  Mirrors EXTRA_FIELDS. */
const EXTRA_BLANK = () => ({
  call_name: null, birth_name: null, title: null, religion: null,
  burial: null, residences: [], contact: null, freetext: null,
  documents: [], edited: null,
});

function blankPerson(id){
  return Object.assign({
    id, name: "", given: "", surname: "", sex: null,
    relation: null, tree: null,
    parents: [], spouses: [], children: [],
    occupation: null, extra: null,
    bio: null, note_text: null, source_text: null,
    notes: [], sources: [], photo: null,
    events: [], page: null, birth: null, death: null,
  }, EXTRA_BLANK());
}

function fillMissing(p){
  const out = blankPerson(p.id);
  Object.assign(out, p);
  return out;
}

/* ---- link hygiene, the mirror of edits.normalise_links -------------------- */
function normaliseLinks(people){
  const byId = new Map(people.map(p => [p.id, p]));
  const clean = (list, self) => {
    const seen = [];
    for(const raw of list || []){
      const n = +raw;
      if(byId.has(n) && n !== self && !seen.includes(n)) seen.push(n);
    }
    return seen;
  };
  for(const p of people){
    p.parents = clean(p.parents, p.id);
    p.spouses = clean(p.spouses, p.id);
    p.children = [];
  }
  for(const p of people)
    for(const parent of p.parents){
      const kids = byId.get(parent).children;
      if(!kids.includes(p.id)) kids.push(p.id);
    }
  for(const p of people)
    for(const spouse of p.spouses){
      const other = byId.get(spouse).spouses;
      if(!other.includes(p.id)) other.push(p.id);
    }
}

/* Rebuild everything derived from the person list.  The two caches hold whole
   ancestor and blood-relative sets, so a stale one would keep drawing the tree
   the way it looked before the edit. */
function refreshGraph(){
  DATA.people.sort((a, b) => a.id - b.id);
  normaliseLinks(DATA.people);
  BY_ID.clear();
  for(const p of DATA.people) BY_ID.set(p.id, p);
  ancCache.clear();
  bloodCache.clear();
  DATA.meta.count = DATA.people.length;
  DATA.meta.photos = DATA.people.filter(p => PHOTOS[p.id]).length;
}

/* ---- talking to the back end -------------------------------------------- */
async function api(route, payload){
  let res;
  try{
    res = await fetch(route, {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Stammbaum-Token": EDIT.token},
      body: JSON.stringify(payload || {}),
    });
  }catch(_){
    // no answer at all: the program is gone, whatever the browser calls it
    showBrokenBar();
    throw new Error("das Programm dahinter antwortet nicht mehr");
  }
  const out = await res.json().catch(() => ({ok: false, fehler: "Keine Antwort vom Programm"}));
  if(!res.ok || !out.ok) throw new Error(out.fehler || ("Fehler " + res.status));
  return out;
}

/* The window outlives the program it belongs to: closing the program leaves the
   page on screen, looking exactly as usable as before.  Without this, the only
   sign is "Failed to fetch" on the next click. */
function showBrokenBar(){
  if(document.getElementById("abriss")) return;
  document.body.insertAdjacentHTML("afterbegin", `<div class="abriss" id="abriss" role="alert">
    <b>Das Programm dahinter läuft nicht mehr.</b>
    <span>Dieses Fenster zeigt nur noch das Bild von vorhin – gespeichert werden kann nichts.
      Fenster schließen und Stammbaum.exe neu starten. Gespeicherte Änderungen sind sicher.</span>
  </div>`);
}

const gone = () => !!document.getElementById("abriss");

let toastTimer = 0;
function say(text, bad){
  const old = document.querySelector(".toast");
  if(old) old.remove();
  document.body.insertAdjacentHTML("beforeend",
    `<div class="toast${bad ? " bad" : ""}" role="status">${esc(text)}</div>`);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    const t = document.querySelector(".toast");
    if(t) t.remove();
  }, bad ? 8000 : 3400);
}

/* ---- the working copy ---------------------------------------------------- */
/* `draft` is what the form edits.  `sidecar` collects every other person whose
   record has to move with it - the other half of a marriage, a child whose
   parent list changed, a person invented in the middle of the form.  They are
   all sent in one save, so a relationship can never end up written on one side
   only. */
let draft = null;
let sidecar = new Map();
let formDirty = false;
let editingNew = false;

function lookup(id){ return sidecar.get(+id) || BY_ID.get(+id); }

function personLabel(id){
  const p = lookup(id);
  if(!p) return "#" + id;
  return p.name || (p.given + " " + p.surname).trim() || ("Person #" + id);
}

/* The sheet is closed by the ✕, by Escape, by the backdrop and by every jump
   to another person, so the unsaved-work question is asked here rather than at
   each of those places. */
function editGuard(){
  if(!formDirty) return true;
  const ok = confirm("Die Änderungen an diesem Steckbrief sind noch nicht gespeichert.\n\nTrotzdem schließen?");
  if(ok){ formDirty = false; draft = null; sidecar.clear(); }
  return ok;
}

/* ---- reading and writing a value by its path ----------------------------- */
/* Every input carries `data-k="birth.year"` or `data-k="events.3.place"`, so
   one delegated listener covers the whole form instead of a hundred small
   ones.  Missing objects along the way are created on first keystroke, which
   is why an empty person can be filled in in any order. */
function getPath(obj, path){
  let node = obj;
  for(const step of path.split(".")){
    if(node == null) return undefined;
    node = node[step];
  }
  return node;
}
function setPath(obj, path, value){
  const steps = path.split(".");
  let node = obj;
  for(let i = 0; i < steps.length - 1; i++){
    const step = steps[i];
    if(node[step] == null) node[step] = /^\d+$/.test(steps[i + 1]) ? [] : {};
    node = node[step];
  }
  node[steps[steps.length - 1]] = value;
}

/* An empty box means "not known", and that has to reach the file as null - an
   empty string would show up as a blank line in the sheet and would count as a
   filled in fact everywhere else. */
function readInput(el){
  if(el.type === "checkbox") return el.checked;
  const raw = el.value.trim();
  if(raw === "") return null;
  if(el.dataset.t === "num"){
    const n = parseInt(raw, 10);
    return Number.isFinite(n) ? n : null;
  }
  return raw;
}

/* ---- form pieces --------------------------------------------------------- */
const val = v => esc(v == null ? "" : v);

function textField(label, path, opts){
  opts = opts || {};
  return `<label class="field"><span>${esc(label)}</span>
    <input type="${opts.type || "text"}" data-k="${path}" value="${val(getPath(draft, path))}"
      ${opts.num ? 'data-t="num" inputmode="numeric"' : ""}
      ${opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : ""}
      ${opts.list ? `list="${opts.list}"` : ""}></label>`;
}

function areaField(label, path, opts){
  opts = opts || {};
  return `<label class="field"><span>${esc(label)}</span>
    <textarea data-k="${path}" rows="${opts.rows || 5}"
      ${opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : ""}
      ${opts.tall ? 'style="min-height:190px"' : ""}>${val(getPath(draft, path))}</textarea></label>`;
}

function checkField(label, path){
  return `<label class="field check"><input type="checkbox" data-k="${path}"
    ${getPath(draft, path) ? "checked" : ""}><span>${esc(label)}</span></label>`;
}

/* Three boxes, not a date picker: most of these people are known by a year
   alone, and every picker insists on a complete date. */
function dateField(label, prefix){
  return `<div class="field"><span>${esc(label)}</span>
    <div class="datebox">
      <input data-k="${prefix}.day" data-t="num" inputmode="numeric" placeholder="T" value="${val(getPath(draft, prefix + ".day"))}">
      <input data-k="${prefix}.month" data-t="num" inputmode="numeric" placeholder="M" value="${val(getPath(draft, prefix + ".month"))}">
      <input data-k="${prefix}.year" data-t="num" inputmode="numeric" placeholder="Jahr" value="${val(getPath(draft, prefix + ".year"))}">
    </div></div>`;
}

function sexField(){
  const now = draft.sex || "";
  const opt = (v, t) => `<option value="${v}"${now === v ? " selected" : ""}>${t}</option>`;
  return `<label class="field"><span>Geschlecht</span><select data-k="sex">
    ${opt("", "unbekannt")}${opt("m", "männlich")}${opt("w", "weiblich")}</select></label>`;
}

/* ---- picking people ------------------------------------------------------ */
function chipsHTML(role, ids){
  if(!ids.length) return `<p class="hintline">Noch niemand eingetragen.</p>`;
  return `<div class="chips">${ids.map(id => `<span class="chipx">${esc(personLabel(id))}
    <small>${esc(lifespan(lookup(id)) || "#" + id)}</small>
    <button type="button" data-unlink="${role}:${id}" aria-label="Verbindung lösen">×</button></span>`).join("")}</div>`;
}

function pickerHTML(role, label){
  return `<div class="picker" data-role="${role}">
    <input type="search" class="pickinput" autocomplete="off" spellcheck="false"
           placeholder="${esc(label)}">
  </div>`;
}

/* The obvious next person, offered by name and reachable in one click.  In the
   menu the same suggestion sits on top, but the menu has to be opened first -
   and the whole point is that entering the second parent should not feel like
   a search when everybody in the room already knows who it is. */
function offerHTML(role){
  const offers = spouseSuggestions(role, new Set([draft.id, ...currentIds(role)]));
  if(!offers.length) return "";
  const why = s => role === "parents"
    ? esc(personLabel(s.person.id)) + " als Elternteil eintragen – Ehepartner von " + esc(personLabel(s.through))
    : esc(personLabel(s.person.id)) + " gehört mit dazu? – steht schon als Elternteil von "
      + esc(personLabel(s.through)) + " drin";
  return `<div class="offers">${offers.map(s =>
    `<button type="button" class="offer" data-link="${role}:${s.person.id}"
       title="${why(s)}">
       ＋ ${esc(personLabel(s.person.id))}</button>`).join("")}</div>`;
}

function linkSection(role, title, ids, hint){
  return `<div class="sec"><h3>${esc(title)}</h3>
    ${chipsHTML(role, ids)}
    ${pickerHTML(role, "Name eintippen und auswählen …")}
    ${offerHTML(role)}

}

function residenceCards(){

function eventCards(){

const DOC_ICON = name => {
  const ext = (name.split(".").pop() || "").toLowerCase();
  if(ext === "pdf") return "▤";
  if(["jpg", "jpeg", "png", "gif", "webp", "tif", "tiff", "bmp"].includes(ext)) return "▣";
  if(["doc", "docx", "odt", "txt", "rtf"].includes(ext)) return "▥";
  return "▪";
};

function docRows(){
  const list = draft.documents || [];
  if(!list.length) return `<p class="hintline">Noch nichts hinterlegt.</p>`;
  return `<div class="stack">${list.map((d, i) => `<div class="docrow">
    <span class="kind">${DOC_ICON(d.file || "")}</span>
    <span><a href="/datei/${draft.id}/${encodeURIComponent(d.file)}" target="_blank" rel="noopener">${esc(d.title || d.file)}</a>
      <small>${esc(d.file)}${d.added ? " · abgelegt " + esc(d.added) : ""}</small></span>
    <button type="button" class="btn" data-dropdoc="${i}">Entfernen</button>
  </div>`).join("")}</div>`;
}

/* ---- carrying out a link -------------------------------------------------- */
async function runLink(){
  if(!linkDraft || !linkDraft.ziel) return;
  const info = document.getElementById("linkInfo");
  const go = document.getElementById("linkGo");
  if(go) go.disabled = true;
  if(info) info.textContent = "Wird verknüpft …";
  try{
    const r = await api("/api/link?k=" + encodeURIComponent(EDIT.token),
      {person: linkDraft.person, ziel: linkDraft.ziel, gruppen: linkDraft.gruppen});
    (r.hinweise || []).forEach(h => say(h, true));
    const wohin = treeTitle(linkDraft.ziel);
    say(r.mitgenommen
      ? `Verknüpft mit „${wohin}“ – ${r.mitgenommen + 1} Personen stehen jetzt in beiden.`
      : `Verknüpft mit „${wohin}“.`);
    // The tree in hand changed underneath us; the page is rebuilt from the
    // server rather than patched, so the diagram and the register cannot show
    // a state the file does not have.
    location.reload();
  }catch(err){
    if(go) go.disabled = false;
    if(info) info.textContent = "";
    say("Nicht verknüpft – " + err.message, true);
  }
}

/* Make the second tree without leaving the dialog.  `newTree()` reloads the
   page, which would throw away the half-filled link the user is standing in -
   so this one adds the tree, puts it into the list in hand, and carries
   straight on to the preview. */
async function neuerBaumFuerLink(){
  if(!linkDraft) return;
  const p = BY_ID.get(linkDraft.person) || {};
  const nachname = (p.surname || "").trim();
  const titel = prompt("Wie soll der neue Stammbaum heißen?",
                       nachname ? "Familie " + nachname : "Familie ");
  if(titel === null || !titel.trim()) return;
  try{
    const r = await api("/api/new?k=" + encodeURIComponent(EDIT.token), {titel: titel.trim()});
    // The server switches to the new tree on creation; this dialog belongs to
    // the one we are standing in, so switch straight back before anything else
    // reads EDIT.offen.
    const neu = r.offen;                 // api_new answers with the new slug here
    await api("/api/open-tree?k=" + encodeURIComponent(EDIT.token), {slug: EDIT.offen});
    EDIT.baeume = (EDIT.baeume || []).concat([{slug: neu, titel: titel.trim(), personen: 0}]);
    linkDraft.ziel = neu;
    refreshLinkPreview();
    say("„" + titel.trim() + "“ angelegt.");
  }catch(err){ say("Nicht angelegt – " + err.message, true); }
}

async function hideLinked(){
  if(!linkDraft) return;
  try{
    await api("/api/link-loesen?k=" + encodeURIComponent(EDIT.token),
      {person: linkDraft.person, modus: "verstecken"});
    say("Wird in diesem Stammbaum nicht mehr gezeichnet. In den anderen steht die Person weiter.");
    location.reload();
  }catch(err){ say("Nicht versteckt – " + err.message, true); }
}

/* Removing a linked person asks which trees, and pre-ticks nothing - the tick
   IS the confirmation.  The tree in hand is only marked, so that a mis-click
   cannot take a family out of a file nobody was looking at. */
async function dropLinked(){
  if(!linkDraft) return;
  const p = BY_ID.get(linkDraft.person) || {};
  const wo = otherTrees(p);
  const alle = [{slug: EDIT.offen, titel: DATA.meta.title || EDIT.offen, hier: true}]
    .concat(wo.map(t => ({slug: t.slug, titel: treeTitle(t.slug), hier: false})));
  closeSheetHard();
  document.body.insertAdjacentHTML("beforeend", `<div class="scrim" id="scrim">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Person entfernen">
      <div class="sheet-head" style="grid-template-columns:minmax(0,1fr) auto">
        <div><div class="kicker">Entfernen · Nr. ${linkDraft.person}</div>
          <h2>${esc(p.name || "Ohne Namen")}</h2>
          <div class="node-meta" style="font-size:14px;margin-top:4px">
            Aus welchen Stammbäumen soll diese Person raus?</div></div>
        <button class="closer" data-close="1" aria-label="Schließen">×</button>
      </div>
      <div class="sheet-body"><div class="sec">
        <div class="stack">${alle.map(t => `<label class="dispose-option"
            style="display:flex;gap:9px;align-items:flex-start;cursor:pointer">
            <input type="checkbox" data-dropbaum="${esc(t.slug)}">
            <span class="dispose-label"><strong>${esc(t.titel)}</strong>
              <span class="dispose-sub">${t.hier ? "der Stammbaum, in dem du gerade bist" : "verknüpft"}</span>
            </span></label>`).join("")}</div>
        <p class="hintline" style="margin-top:12px">Nichts ist vorgehakt – das Ankreuzen ist die
          Bestätigung. Ein nicht angekreuzter Stammbaum behält die Person vollständig.
          Was entfernt wird, liegt in der Sicherung des jeweiligen Baums.</p>
      </div></div>
      <div class="sheet-foot">
        <button class="btn primary" id="dropGo">Entfernen</button>
        <button class="btn" data-close="1">Abbrechen</button>
      </div>
    </div></div>`);
  document.body.style.overflow = "hidden";
  const go = document.getElementById("dropGo");
  go.addEventListener("click", async () => {
    const baeume = Array.from(document.querySelectorAll("[data-dropbaum]"))
      .filter(b => b.checked).map(b => b.dataset.dropbaum);
    if(!baeume.length){ say("Kein Stammbaum angekreuzt.", true); return; }
    try{
      await api("/api/link-loesen?k=" + encodeURIComponent(EDIT.token),
        {person: linkDraft.person, modus: "loeschen", baeume});
      location.reload();
    }catch(err){ say("Nicht entfernt – " + err.message, true); }
  });
}

/* ---- linking this person into another tree ------------------------------- */
/* The button sits under the × in the form's top right corner: the corner is
   where what happens TO this sheet lives, and linking is exactly that - it is
   not a field of the person, so it does not belong in the body among them. */
/* Shown whether or not a second tree exists yet.  It used to be hidden until
   there was one, on the reasoning that there was nowhere to link to - which
   got it exactly backwards: somebody with one tree is precisely the person who
   has not discovered the feature, and hiding it means they never will.  The
   dialog offers to make the second tree instead. */
function linkButtonHTML(p){
  if(!EDIT) return "";
  const wo = otherTrees(p);
  return wo.length
    ? `<button type="button" class="btn" data-linkopen="${p.id}"
         title="Steht auch in: ${esc(wo.map(t => treeTitle(t.slug)).join(" · "))}">⧉ Verknüpfung …</button>`
    : `<button type="button" class="btn" data-linkopen="${p.id}"
         title="Dieselbe Person auch in einem anderen Stammbaum führen">⧉ Verknüpfen …</button>`;
}

/* The state the link dialog is in while it is open.  It is asked fresh from
   the server on every change of target or group, because the answer depends on
   both trees and neither is guessable from here. */
let linkDraft = null;

function linkDialogHTML(){
  const d = linkDraft;
  const p = BY_ID.get(d.person) || {};
  const others = ((EDIT && EDIT.baeume) || []).filter(t => t.slug !== EDIT.offen);

  document.body.style.overflow = "hidden";

}

function markDirty(state){
  formDirty = state;
  const info = document.getElementById("saveInfo");
  if(info){
    info.textContent = state ? "Noch nicht gespeichert" : "";
    info.classList.toggle("warn", !!state);
  }

/* Closing without asking - used by renderForm, which is not a close at all. */
function closeSheetHard(){
  const s = document.getElementById("scrim");
  if(s) s.remove();
  document.body.style.overflow = "";
}

/* ---- opening ------------------------------------------------------------- */
/* A number nobody is using yet.  The draft of a brand-new person sits on
   EDIT.nextId without spending it, so anyone else asking for a number while
   that form is open - a person invented in a picker, an unknown parent - has
   to step over it, or two people would be saved under the same number and the
   second would quietly overwrite the first. */
function reserveId(){
  if(draft && EDIT.nextId === draft.id) EDIT.nextId++;
  return EDIT.nextId++;
}

function openEditor(id, seed){
  if(!EDIT) return false;
  if(!editGuard()) return false;
  sidecar = new Map();
  if(id == null){
    draft = blankPerson(EDIT.nextId);
    editingNew = true;
    draft._children = [];
    if(seed) seedRelation(seed);
  } else {
    draft = JSON.parse(JSON.stringify(fillMissing(BY_ID.get(id))));
    editingNew = false;
    draft._children = (BY_ID.get(id).children || []).slice();
  }
  /* What the tree held before this form was opened.  A person who does not
     exist yet held nothing, so a tie brought in by `seed` counts as new and
     is written to the other side on saving. */
  draft._childrenWere = editingNew ? [] : (draft._children || []).slice();
  draft._spousesWere = editingNew ? [] : (draft.spouses || []).slice();
  formDirty = editingNew;
  renderForm();
  return true;
}

/* ---- adding a relative of somebody --------------------------------------
   The form opens on an empty person who is already tied to the one that was
   clicked, so that only the name is left to type.  Siblings are the awkward
   one: the tree has no such link, brothers and sisters are simply people who
   share a parent - so a sibling of somebody whose parents are unknown needs a
   parent invented first, and that is what the "?" is. */
function seedRelation(seed){
  const other = BY_ID.get(seed.other);
  if(!other) return;
  /* The surname of the box that was clicked, written into the field rather
     than into the record: in this family the next relative usually carries it,
     and where they do not - a wife under her maiden name, a child given the
     mother's - it is one field to clear.  Guessing further than the box that
     was actually clicked would be guessing about a marriage. */
  if(other.surname){
    draft.surname = other.surname;
    draft._surnameSeeded = true;
  }
  if(seed.role === "parent"){
    draft._children = [other.id];
    return;
  }
  if(seed.role === "child"){
    draft.parents = [other.id];
    return;
  }
  if(seed.role === "sibling"){
    const known = (other.parents || []).slice();
    if(known.length){ draft.parents = known; return; }
    const stranger = blankPerson(reserveId());
    stranger.name = "?";
    sidecar.set(stranger.id, stranger);
    const mine = touch(other.id);   // `touch` puts the copy into the sidecar
    if(mine) mine.parents = (mine.parents || []).concat([stranger.id]);
    draft.parents = [stranger.id];
  }
}

function newRelative(role, other){
  if(!EDIT) return;
  if(!openEditor(null, {role, other})) return;   // unsaved work kept the form
  const who = personLabel(other);
  // The child already has one parent: say so straight away, because the offer
  // to put the two together is sitting in the form and is easy to walk past.
  const schon = role === "parent"
    ? ((BY_ID.get(other) || {}).parents || []).filter(id => id !== draft.id)
    : [];
  say(schon.length
    ? "Neuer Elternteil von " + who + ". " + personLabel(schon[0])
      + " steht dort schon – unter „Ehe und Partnerschaft“ wird angeboten, die beiden zu verbinden."
    : role === "parent" ? "Neuer Elternteil von " + who + " – Name eintragen und speichern."
    : role === "child" ? "Neues Kind von " + who + " – Name eintragen und speichern."
    : (draft.parents || []).some(p => sidecar.has(p))
      ? "Neues Geschwister von " + who + ". Die Eltern sind unbekannt – beide bekommen "
        + "einen Elternteil „?“, der später einen Namen bekommen kann."
      : "Neues Geschwister von " + who + " – die Eltern sind schon eingetragen.");
}

/* ---- saving -------------------------------------------------------------- */
function composeName(p){
  if(p.name && p.name.trim()) return p.name.trim();
  const built = ((p.given || "") + " " + (p.surname || "")).trim();
  return built || ("Person " + p.id);
}

async function takeOver(){

  if(button){ button.disabled = true; button.textContent = "Übernimmt …"; }

    say(out.personen + " Personen übernommen. Die Seite lädt neu.");
    setTimeout(() => location.reload(), 900);
  }catch(err){
    say("Nicht übernommen – " + err.message, true);
    if(button){ button.disabled = false; button.textContent = "Übernehmen"; }
  }
}

async function saveDraft(){
  /* The surname a "＋" wrote into the field would otherwise satisfy the check
     below all by itself, and a person called nothing but their surname would go
     into the tree unremarked. */
  if(draft._surnameSeeded && !draft.given && !(draft.name || "").trim()){
    say("Da steht bisher nur der Nachname – der Vorname fehlt noch.", true);
    return;
  }
  draft.name = composeName(draft);
  if(!draft.given && !draft.surname && !draft.name){
    say("Ohne einen Namen lässt sich die Person nicht ablegen.", true);
    return;
  }
  draft.edited = new Date().toISOString().slice(0, 19).replace("T", " ");

  const me = draft.id;
  const payload = {};

  /* the other half of every marriage that was added or cut - and only those:
     a record written here overrides the report for good, so a spouse who was
     not touched must stay out of the overlay */
  const before = new Set(draft._spousesWere);
  const after = new Set(draft.spouses || []);
  const movedSpouses = [...new Set([...before, ...after])].filter(id => before.has(id) !== after.has(id));
  for(const other of movedSpouses){
    const person = touch(other);
    if(!person) continue;
    const list = person.spouses.filter(x => x !== me);
    if(after.has(other)) list.push(me);
    person.spouses = list;
    payload[other] = strip(person);
  }

  /* a child is linked through its own parent list, so that is what changes */
  const kidsBefore = new Set(draft._childrenWere);
  const kidsAfter = new Set(draft._children || []);
  const movedKids = [...new Set([...kidsBefore, ...kidsAfter])].filter(id => kidsBefore.has(id) !== kidsAfter.has(id));
  for(const kid of movedKids){
    const person = touch(kid);
    if(!person) continue;
    const list = person.parents.filter(x => x !== me);
    if(kidsAfter.has(kid)) list.push(me);
    person.parents = list;
    payload[kid] = strip(person);
  }

  /* people invented inside the picker come along in the same save */
  for(const [id, person] of sidecar) if(!payload[id]) payload[id] = strip(person);

  payload[me] = strip(draft);

  const btn = document.getElementById("saveBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Speichert …"; }
  try{
    const out = await api("/api/save?k=" + encodeURIComponent(EDIT.token), {people: payload});
    EDIT.nextId = out.nextId;
    for(const [id, record] of Object.entries(payload)){
      const known = BY_ID.get(+id);
      if(known) Object.assign(known, fillMissing(record));
      else DATA.people.push(fillMissing(record));
    }
    refreshGraph();
    // No automatic centre.  A tree whose middle has just gone goes back to
    // showing everybody and waits to be told - it does not appoint a successor.
    if(ME !== null && !BY_ID.has(ME)) ME = null;
    if(centre !== null && !BY_ID.has(centre)) centre = ME;
    formDirty = false;
    draft = null;
    sidecar.clear();
    closeSheetHard();
    // A saved relative should appear beside the box it was added from, not
    // send the reader hunting: the armed box holds the view in place.
    holdInPlace(armed !== null ? armed : centre);
    draw();
    say("Gespeichert. " + out.count + (out.count === 1 ? " Person" : " Personen") + " im Baum.");
  }catch(err){
    say("Nicht gespeichert – " + err.message, true);
    if(btn){ btn.disabled = false; btn.textContent = "Speichern"; }
  }
}

/* A record about to be written: the scratch fields the form uses are not part
   of the data model and must not reach the file. */
function strip(p){
  const out = Object.assign({}, p);
  delete out._children;
  delete out._childrenWere;
  delete out._spousesWere;
  delete out._surnameSeeded;
  return out;
}

/* A person the save is about to change, taken from the scratch pile if they
   were invented a moment ago and from the tree otherwise. */
function touch(id){
  if(sidecar.has(id)) return sidecar.get(id);
  const known = BY_ID.get(id);
  if(!known) return null;
  const copy = JSON.parse(JSON.stringify(fillMissing(known)));
  sidecar.set(id, copy);
  return copy;
}

async function removePerson(){
  const p = BY_ID.get(draft.id);
  if(!p) return;
  const ties = [];
  if(p.parents.length) ties.push(p.parents.length + " Elternteil(e)");
  if(p.spouses.length) ties.push(p.spouses.length + " Ehe(n)");
  if(p.children.length) ties.push(p.children.length + " Kind(er)");
  const warn = "„" + p.name + "“ wirklich aus dem Baum nehmen?\n\n" +
    (ties.length ? "Dabei werden gelöst: " + ties.join(", ") + ".\n" : "") +
    "Die Person verschwindet aus allen Ansichten. Rückgängig geht das nur, indem der Eintrag " +
    "aus data/edits.json wieder herausgenommen wird.";
  if(!confirm(warn)) return;
  try{
    await api("/api/save?k=" + encodeURIComponent(EDIT.token), {removed: [draft.id]});
    const at = DATA.people.findIndex(q => q.id === draft.id);
    if(at >= 0) DATA.people.splice(at, 1);
    if(ME === draft.id) ME = null;
    if(centre === draft.id) centre = ME;
    formDirty = false;
    draft = null;
    refreshGraph();
    closeSheetHard();
    draw();
    say("Entfernt.");
  }catch(err){
    say("Nicht entfernt – " + err.message, true);
  }
}

/* ---- uploads ------------------------------------------------------------- */
function pickFile(accept){
  return new Promise(resolve => {
    const input = document.createElement("input");
    input.type = "file";
    if(accept) input.accept = accept;
    input.addEventListener("change", () => resolve(input.files[0] || null), {once: true});
    input.click();
  });
}

const asBase64 = file => new Promise((ok, no) => {
  const reader = new FileReader();
  reader.onload = () => ok(String(reader.result).split(",")[1] || "");
  reader.onerror = () => no(new Error("Die Datei ließ sich nicht lesen."));
  reader.readAsDataURL(file);
});

/* A portrait is shown at 36 x 46 pixels in the diagram and 112 x 142 on the
   sheet, so 600 across is already generous.  A photo straight off a phone is
   ten times that and would be carried, at full size, into every exported page
   and into the file the family gets.  It is shrunk here rather than in the
   program, which is what lets the program do without an image library. */
const PORTRAIT_MAX = 600;

function shrinkPortrait(file){
  return new Promise(ok => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        if(img.width <= PORTRAIT_MAX && img.height <= PORTRAIT_MAX * 1.5)
          return ok(null);                       // small enough as it is
        const scale = Math.min(PORTRAIT_MAX / img.width, (PORTRAIT_MAX * 1.5) / img.height);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const pen = canvas.getContext("2d");
        pen.imageSmoothingQuality = "high";
        pen.drawImage(img, 0, 0, canvas.width, canvas.height);
        try{ ok(canvas.toDataURL("image/jpeg", 0.86).split(",")[1]); }
        catch(_){ ok(null); }                    // a picture is better than none
      };
      img.onerror = () => ok(null);
      img.src = String(reader.result);
    };
    reader.onerror = () => ok(null);
    reader.readAsDataURL(file);
  });
}

async function uploadFor(kind){
  const file = await pickFile(kind === "foto" ? "image/*" : undefined);
  if(file) await storeFile(kind, file);
}

/* Kept apart from the file dialog so that the storing half can be exercised
   without a human clicking through a native picker. */
async function storeFile(kind, file){
  say("Überträgt " + file.name + " …");
  try{
    let name = file.name;
    let data = kind === "foto" ? await shrinkPortrait(file) : null;
    if(data) name = name.replace(/\.[^.]+$/, "") + ".jpg";
    else data = await asBase64(file);
    const out = await api("/api/upload?k=" + encodeURIComponent(EDIT.token), {
      kind, person: draft.id, name, data,
    });
    if(kind === "foto"){
      draft.photo = out.file;
      PHOTOS[draft.id] = out.url;
    } else {
      draft.documents = draft.documents || [];
      draft.documents.push({
        file: out.file,
        title: file.name.replace(/\.[^.]+$/, ""),
        kind: (file.name.split(".").pop() || "").toLowerCase(),
        added: new Date().toISOString().slice(0, 10),
      });
    }
    markDirty(true);
    renderForm();
    say(kind === "foto" ? "Bild übernommen." : "Datei abgelegt. Noch speichern nicht vergessen.");
  }catch(err){
    say("Nicht übernommen – " + err.message, true);
  }
}

/* ---- the picker dropdown ------------------------------------------------- */
function closeMenus(){
  document.querySelectorAll(".pickmenu").forEach(m => m.remove());
}

function currentIds(role){
  if(role === "children") return draft._children || [];
  return draft[role] || [];
}

function openMenu(picker){
  const role = picker.dataset.role;
  const input = picker.querySelector(".pickinput");
  const q = fold(input.value.trim());
  closeMenus();
  const taken = new Set([draft.id, ...currentIds(role)]);
  const matches = p => {
    const name = p.name || (p.given + " " + p.surname).trim();
    return !q || fold(name + " " + (p.birth && p.birth.place || "") + " " +
                      ((p.birth || {}).year || "")).includes(q);
  };
  /* Taken out of the ordinary list and put on top instead, so the same person
     is never offered twice. */
  const suggested = spouseSuggestions(role, taken).filter(s => matches(s.person));
  for(const s of suggested) taken.add(s.person.id);

  const pool = [...DATA.people, ...sidecar.values()];
  const seen = new Set();
  const hits = [];
  for(const p of pool){
    if(taken.has(p.id) || seen.has(p.id)) continue;
    seen.add(p.id);
    if(!matches(p)) continue;
    hits.push(p);
    if(hits.length >= 40) break;
  }
  const rows = hits.map(p => `<button type="button" data-link="${role}:${p.id}">${esc(p.name ||
    (p.given + " " + p.surname).trim() || "#" + p.id)}<small>${esc(lifespan(p) || "#" + p.id)}</small></button>`);
  for(const s of suggested.slice().reverse())
    rows.unshift(`<button type="button" class="suggest" data-link="${role}:${s.person.id}">${esc(personLabel(s.person.id))}<small>Ehepartner von ${esc(personLabel(s.through))}</small></button>`);
  if(input.value.trim())
    rows.unshift(`<button type="button" class="make" data-make="${role}">„${esc(input.value.trim())}“ als neue Person anlegen</button>`);
  if(!rows.length) rows.push(`<button type="button" disabled>Niemand gefunden.</button>`);
  picker.insertAdjacentHTML("beforeend", `<div class="pickmenu">${rows.join("")}</div>`);
}

/* One parent is in, so the other one is worth guessing at - but only from a
   marriage, and only as the top row of a list that is otherwise unchanged.
   Nothing is entered by itself: who fathered a child is not something a
   program may decide from a wedding date, and a wrong guess written into a
   family tree is an accusation. */
function spouseSuggestions(role, taken){
  const out = [];
  const seen = new Set();
  const add = (id, through) => {
    if(id === draft.id || taken.has(id) || seen.has(id)) return;
    const person = lookup(id);
    if(!person) return;
    seen.add(id);
    out.push({person, through});
  };
  if(role === "parents"){
    for(const parent of draft.parents || []){
      const p = lookup(parent);
      if(!p) continue;
      for(const mate of p.spouses || []) add(mate, parent);
    }
    return out;
  }
  // The other way round: this person is being entered as a parent of a child
  // who already has one.  That other parent is the obvious partner, and asking
  // is cheaper than making the reader search for a name they just came from.
  if(role === "spouses"){
    for(const kid of draft._children || []){
      const k = lookup(kid);
      if(!k) continue;
      for(const other of k.parents || []) add(other, kid);
    }
    return out;
  }
  return out;
}

function linkPerson(role, id){
  id = +id;
  if(role === "children"){
    draft._children = draft._children || [];
    if(!draft._children.includes(id)) draft._children.push(id);
  } else {
    draft[role] = draft[role] || [];
    if(!draft[role].includes(id)) draft[role].push(id);
  }
  markDirty(true);
  closeMenus();
  renderForm();
}

function unlinkPerson(role, id){
  id = +id;
  if(role === "children") draft._children = (draft._children || []).filter(x => x !== id);
  else draft[role] = (draft[role] || []).filter(x => x !== id);
  markDirty(true);
  renderForm();
}

/* A name typed into the picker that belongs to nobody yet: the person is made
   up on the spot, kept aside, and written in the same save as the draft - so
   throwing the form away throws them away too. */
function makePerson(role, name){
  const id = reserveId();
  const parts = name.trim().split(/\s+/);
  const person = blankPerson(id);
  person.given = parts.slice(0, -1).join(" ") || parts[0] || "";
  person.surname = parts.length > 1 ? parts[parts.length - 1] : "";
  person.name = name.trim();
  sidecar.set(id, person);
  linkPerson(role, id);
  say("„" + person.name + "“ angelegt. Steckbrief ausfüllen geht nach dem Speichern.");
}

/* ------------------------------------------------------------------ wiring */
document.addEventListener("click", e => {
  const mine = e.target.closest("[data-me]");
  if(mine){ setMe(+mine.dataset.me || null); closeSheet(); return; }
  const closer = e.target.closest("[data-close]");
  if(closer){
    const c = closer.closest("[data-centre]") || closer;
    if(c.dataset.centre){ holdInPlace(+c.dataset.centre); setCentre(+c.dataset.centre); }
    closeSheet();
    return;
  }
  const info = e.target.closest("[data-open]");
  if(info){ openSheet(+info.dataset.open); return; }
  const plus = e.target.closest("[data-relnew]");
  if(plus && typeof newRelative === "function"){
    const [role, other] = plus.dataset.relnew.split(":");
    newRelative(role, +other);
    return;
  }
  const node = e.target.closest("[data-centre]");
  // Clicking a box makes that person the middle without moving the picture:
  // the box stays under the pointer, so its "+" buttons are where the hand
  // already is and the rest of the family regroups around it.
  if(node){ holdInPlace(+node.dataset.centre); setCentre(+node.dataset.centre); closeSheet(); return; }
  if(e.target.id === "scrim") closeSheet();
  // A click past the boxes puts the add buttons away - but working inside a
  // sheet is not "past the boxes", or they would be gone on coming back out.
  if(!e.target.closest(".box") && !e.target.closest(".sheet")) disarm();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeSheet();
  if(e.key === "/" && document.activeElement.id !== "q"){
    e.preventDefault(); document.getElementById("q").focus();
  }
});
(function panAndZoom(){
  const stage = document.getElementById("stage");
  let down = false, sx = 0, sy = 0, ox = 0, oy = 0;
  stage.addEventListener("pointerdown", e => {
    if(e.target.closest(".box")) return;
    down = true; sx = e.clientX; sy = e.clientY; ox = view.x; oy = view.y;
    stage.classList.add("grabbing"); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    if(!down) return;
    view.x = ox + (e.clientX - sx);
    view.y = oy + (e.clientY - sy);
    applyScale();
  });
  const stop = () => {
    if(!down) return;
    down = false; stage.classList.remove("grabbing");
  };
  window.addEventListener("resize", syncRail);
  stage.addEventListener("pointerup", stop);
  stage.addEventListener("pointercancel", stop);
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    if(e.ctrlKey || e.altKey || Math.abs(e.deltaX) < 2){
      zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
    } else {
      view.x -= e.deltaX; view.y -= e.deltaY; applyScale();
    }
  }, {passive: false});
  /* hovering a person lights up every line that belongs to them */
  const plane = document.getElementById("plane");
  let hot = [];
  const cool = () => {
    for(const el of hot) el.classList.remove("hot", "kin");
    hot = [];
    plane.classList.remove("focus");
  };
  plane.addEventListener("pointerover", e => {
    const box = e.target.closest(".box");
    if(!box || !box.dataset.person){ cool(); return; }
    if(box.classList.contains("kin") && hot.length) return;   // already lit
    cool();
    const id = box.dataset.person;
    hot = Array.from(plane.querySelectorAll(`.wires path[data-kin~="${id}"]`));
    const near = new Set([+id]);
    for(const path of hot)
      for(const p of path.dataset.kin.split(" ")) near.add(+p);
    for(const other of near){
      const el = plane.querySelector(`.box[data-person="${other}"]`);
      if(el){ el.classList.add("kin"); hot.push(el); }
    }
    for(const el of hot) if(el.tagName === "path") el.classList.add("hot");
    if(hot.length) plane.classList.add("focus");
  });
  plane.addEventListener("pointerleave", cool);

  document.getElementById("zoomIn").addEventListener("click", () => zoomBy(1.2));
  document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1 / 1.2));
  document.getElementById("zoomFit").addEventListener("click", fitToCentre);
  document.getElementById("zoomReset").addEventListener("click", () => {
    view.scale = 1; applyScale(); centreView();
  });
  document.querySelectorAll("#designs .btn").forEach(b => b.addEventListener("click", () => {
    design = b.dataset.design;
    document.querySelectorAll("#designs .btn").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
    renderTree();
  }));
  document.querySelectorAll(".legend .pickable").forEach(s => s.addEventListener("click", () => {
    const plane = document.getElementById("plane");
    const now = plane.dataset.only;
    const next = now === s.dataset.only ? "" : s.dataset.only;
    if(next) plane.dataset.only = next; else delete plane.dataset.only;
    document.querySelectorAll(".legend .pickable").forEach(o =>
      o.setAttribute("aria-pressed", String(o.dataset.only === next)));
  }));
  document.querySelectorAll("#modes .btn[data-mode]").forEach(b => b.addEventListener("click", () => {
    setMode(b.dataset.mode);
    renderTree();
  }));

  /* The two little menus beside the view buttons.  The "Alle" one shows
     itself whenever that view is on, because its single switch is about what
     is on screen right now; the "near" one is opened deliberately, because
     its three are settings somebody goes looking for. */
  const nearBtn = document.getElementById("nearMore");
  const nearMenu = document.getElementById("nearMenu");
  if(nearBtn && nearMenu){
    nearBtn.addEventListener("click", e => {
      e.stopPropagation();
      const open = nearMenu.hidden;
      nearMenu.hidden = !open;
      nearBtn.setAttribute("aria-expanded", String(open));
    });
    document.addEventListener("click", e => {
      if(nearMenu.hidden || nearMenu.contains(e.target) || nearBtn.contains(e.target)) return;
      nearMenu.hidden = true;
      nearBtn.setAttribute("aria-expanded", "false");
    });
    nearMenu.querySelectorAll("input[data-near]").forEach(box =>
      box.addEventListener("change", () => {
        nearExtra[box.dataset.near] = box.checked;
        if(mode === "nah") renderTree();
      }));
  }
  const linkedBox = document.getElementById("showLinked");
  if(linkedBox) linkedBox.addEventListener("change", () => {
    showLinked = linkedBox.checked;
    if(mode === "alle") renderTree();
  });
})();

/* =================================================================== exporter
   Ticking what may leave the house, then writing it out as a page, a picture
   or a printed book.

   The diagram is redrawn here as real SVG rather than photographed off the
   screen.  A `foreignObject` wrapper around the existing HTML would have been
   ten lines instead of a hundred, but it only opens in a browser, and the
   point of the picture is that it can go to a print shop as a poster and be
   opened on a phone.  Every position is read back out of the laid out plane,
   so the drawing is the same one that is on screen - including whichever view
   and design are switched on at that moment.

   Everything is drawn in the light palette even when the screen is in
   Abendlicht: this goes to paper and to other people. */

const EXPORT_FIELDS = [
