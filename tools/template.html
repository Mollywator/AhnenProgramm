<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  --paper:#f2eee4;
  --paper-2:#e9e4d7;
  --card:#fbf9f4;
  --ink:#1d1a16;
  --ink-2:#5d564a;
  --ink-3:#8b8375;
  --rule:#d5cdbb;
  --rule-2:#c2b8a2;
  --accent:#8f2f22;
  --accent-soft:#f0dcd6;
  --male:#3d5a6c;
  --female:#8a4a58;
  --heirat-fill:#efe7d6;
  --heirat-line:#a8894f;
  --indirekt-fill:#e6e7e2;
  --indirekt-line:#7d8a86;
  --shadow:0 1px 2px rgba(40,32,20,.06),0 8px 24px -12px rgba(40,32,20,.28);
  /* fonts that ship with Windows and macOS, so the file needs no download */
  --serif:Constantia,"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
  --sans:"Franklin Gothic Book","Franklin Gothic Medium",Corbel,"Avenir Next Condensed","Segoe UI",sans-serif;
  /* sheets used to dim, instead of `opacity` - see the note on the box rules */
  --veil:rgba(242,238,228,.62);
  --veil-strong:rgba(242,238,228,.86);
  --line-dim:#ddd5c4;
  --hull-fill:rgba(230,231,226,.5);
}
html[data-theme="abend"]{
  --paper:#14130f;
  --paper-2:#1c1a15;
  --card:#211e18;
  --ink:#eee7d8;
  --ink-2:#b3a992;
  --ink-3:#7d7461;
  --rule:#332e25;
  --rule-2:#463f32;
  --accent:#d4715c;
  --accent-soft:#3a231d;
  --male:#7fa4b8;
  --female:#c98d9c;
  --heirat-fill:#2a2317;
  --heirat-line:#a98f57;
  --indirekt-fill:#1e2422;
  --indirekt-line:#6d8079;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.8);
  --veil:rgba(20,19,15,.66);
  --veil-strong:rgba(20,19,15,.88);
  --line-dim:#39332a;
  --hull-fill:rgba(30,36,34,.5);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.5;
  display:flex;flex-direction:column;height:100vh;
}

/* ----------------------------------------------------------------- chrome */
.masthead{
  flex:0 0 auto;z-index:60;
  display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;
  padding:14px 26px 12px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
}
.masthead h1{
  margin:0;font-size:23px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  font-family:var(--sans);line-height:1;
}
/* In the program the heading is also the way between trees.  It started out as
   plain text that happened to be clickable, and nobody found it - so it looks
   like the dropdown it is.  In the file the family gets, none of this applies
   and the heading is only a heading. */
html[data-edit] .masthead h1{
  cursor:pointer;font:inherit;color:inherit;
  font-size:23px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  font-family:var(--sans);line-height:1;
  border:1px solid var(--rule-2);background:var(--card);
  padding:8px 12px 8px 14px;border-radius:2px;
  display:inline-flex;align-items:center;gap:12px;
}
html[data-edit] .masthead h1::after{
  content:"▾";font-size:15px;color:var(--ink-3);
  border-left:1px solid var(--rule);padding-left:11px;line-height:1;
}
html[data-edit] .masthead h1:hover{border-color:var(--accent);color:var(--accent)}
html[data-edit] .masthead h1:hover em{color:var(--accent)}
html[data-edit] .masthead h1:hover::after{color:var(--accent);border-color:var(--accent)}
html[data-edit] .masthead h1:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* and a word under it, because an icon alone is a guess */
html[data-edit] .masthead .sub::before{
  content:"Zum Wechseln auf den Namen klicken · ";color:var(--ink-2);
}
.treerow{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;
  width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);
  border-radius:2px;padding:11px 13px;cursor:pointer;color:inherit;font:inherit;
  transition:.14s;
}
.treerow:hover{border-color:var(--accent);color:var(--accent)}
.treerow.jetzt{border-color:var(--ink);background:var(--accent-soft);cursor:default}
.treerow b{font-weight:500;font-size:16.5px;display:block}
.treerow small{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);
  display:block;margin-top:2px;
}
.masthead h1 em{font-style:normal;color:var(--accent)}
.masthead .sub{
  font-size:12.5px;color:var(--ink-3);letter-spacing:.06em;font-family:var(--sans);
  text-transform:uppercase;margin-top:5px;
}
.spacer{flex:1 1 auto}
.tools{display:flex;align-items:center;gap:10px}
.btn{
  font-family:var(--sans);font-size:13px;letter-spacing:.09em;text-transform:uppercase;
  background:transparent;color:var(--ink-2);border:1px solid var(--rule-2);
  padding:7px 13px;border-radius:2px;cursor:pointer;transition:.16s;
}
.btn:hover{color:var(--ink);border-color:var(--ink-3);background:var(--card)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fbf7ef}
.btn.primary:hover{filter:brightness(1.12);color:#fff}

/* ------------------------------------------------------------------ shell */
.shell{
  flex:1 1 auto;min-height:0;
  display:grid;grid-template-columns:352px minmax(0,1fr);
}
@media(max-width:940px){
  html,body{overflow:auto}
  body{height:auto;display:block}
  .shell{grid-template-columns:1fr}
  .register{border-right:0;border-bottom:1px solid var(--rule)}
}

/* --------------------------------------------------------------- register */
.register{
  z-index:2;border-right:1px solid var(--rule);background:var(--paper-2);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
@media(max-width:940px){.register{height:auto;max-height:70vh}}
.searchbox{padding:16px 18px 12px;border-bottom:1px solid var(--rule)}
.searchbox input{
  width:100%;padding:10px 12px;border:1px solid var(--rule-2);background:var(--card);
  color:var(--ink);font-family:var(--serif);font-size:16px;border-radius:2px;
}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.searchbox input::placeholder{color:var(--ink-3)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:4px 9px;border:1px solid var(--rule-2);border-radius:999px;cursor:pointer;
  color:var(--ink-3);background:transparent;transition:.16s;
}
.chip:hover{color:var(--ink-2);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.counter{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 18px;border-bottom:1px solid var(--rule);
}
.list{overflow-y:auto;flex:1;padding:4px 0 40px}
.row{
  display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;align-items:center;
  width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:9px 18px;cursor:pointer;color:inherit;font:inherit;transition:background .14s;
}
.row:hover{background:var(--card)}
.row.is-centre{background:var(--accent-soft)}
.row.is-centre .row-name{color:var(--accent)}
.avatar{
  width:38px;height:46px;object-fit:cover;border-radius:1px;display:block;
  background:var(--rule);box-shadow:0 0 0 1px var(--rule-2);
}
img.avatar.gone,img.portrait.gone{filter:grayscale(1) contrast(.95)}
.avatar.mono{
  display:grid;place-items:center;font-family:var(--sans);font-size:13px;letter-spacing:.06em;
  color:var(--ink-3);background:var(--card);
}
.row-name{font-size:16.5px;line-height:1.25;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{
  font-family:var(--sans);font-size:12px;letter-spacing:.05em;color:var(--ink-3);
  display:flex;gap:7px;margin-top:1px;
}
.row-rel{color:var(--accent);text-transform:uppercase;letter-spacing:.08em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-rel.weak{color:var(--ink-3);font-style:italic;text-transform:none;letter-spacing:.03em}
.sex{font-size:11px}
.sex.m{color:var(--male)}
.sex.w{color:var(--female)}

/* ----------------------------------------------------------------- canvas */
.canvas{
  padding:13px 26px 14px;min-width:0;min-height:0;position:relative;z-index:2;
  display:flex;flex-direction:column;
}
.hint{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);
}
.hint b{color:var(--ink-2);font-weight:500}

.stage{
  position:relative;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);
  overflow:hidden;height:100%;cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(var(--rule) 1px,transparent 1px);background-size:22px 22px;
}
.stage.grabbing{cursor:grabbing}
.stagewrap{flex:1 1 auto;min-height:0}
.pan{position:absolute;left:0;top:0;transform-origin:0 0}
.plane{position:relative}
.wires{position:absolute;inset:0;overflow:visible;pointer-events:none}
.wires path{fill:none;stroke:var(--rule-2);stroke-width:1.5}
.wires path.marriage{stroke:var(--ink-3);stroke-width:2}
.wires path.lit{stroke:var(--accent);stroke-width:2}

.box{
  position:absolute;background:var(--card);border:1px solid var(--rule-2);border-radius:3px;
  box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;
}
.box:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:5}
/* The clipping sits on the button rather than on the box itself, so the four
   add buttons may hang over the edge without being cut off. */
.box .pick{
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:center;
  width:100%;height:100%;background:none;border:0;padding:0 30px 0 8px;
  cursor:pointer;text-align:left;font:inherit;color:inherit;
  overflow:hidden;border-radius:inherit;
}
.box .lines{min-width:0}
.box .thumb{
  width:36px;height:46px;object-fit:cover;border-radius:1px;display:block;
  background:var(--paper-2);box-shadow:0 0 0 1px var(--rule);
}
.box .thumb.mono{
  display:grid;place-items:center;font-family:var(--sans);font-size:12px;letter-spacing:.05em;
  color:var(--ink-3);
}
.box.gone .thumb{filter:grayscale(1) contrast(.95)}
.box b{font-weight:500;font-size:15.5px;line-height:1.15;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box i{
  font-style:normal;font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;
  color:var(--ink-3);display:block;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.box u{
  text-decoration:none;font-family:var(--sans);font-size:11.5px;letter-spacing:.04em;
  color:var(--ink-2);display:block;margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.box u .died{color:var(--ink-3);margin-left:7px}
.box .rel{color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.box.centre{
  border-color:var(--accent);border-width:2px;background:var(--card);
  box-shadow:0 0 0 4px var(--accent-soft),var(--shadow);
}
.box.centre b{color:var(--accent);font-weight:600}
.box.married{
  background:color-mix(in srgb,var(--card) 70%,var(--paper-2));
  border-style:dashed;border-color:var(--rule-2);
}
.box.married b{color:var(--ink-2)}
.box.blood{border-left:3px solid var(--rule-2)}
.box.blood.up{border-left-color:var(--male)}
.box.blood.down{border-left-color:var(--female)}
.box.blood.side{border-left-color:var(--accent)}
.wires path.marriage{stroke:var(--ink-3);stroke-width:1.5}
.wires path.bridge{stroke:var(--heirat-line);stroke-width:2}
.wires path.far{stroke-dasharray:7 5;stroke:var(--indirekt-line)}
.wires path.hot{stroke:var(--accent);stroke-width:2.6;stroke-dasharray:none}
.plane.focus .wires path:not(.hot){stroke:var(--line-dim)}
.plane.focus .box:not(.kin)::after,
.plane[data-only] .box::after{
  content:"";position:absolute;inset:0;pointer-events:none;background:var(--veil);
}
.plane[data-only] .box::after{background:var(--veil-strong)}
.box.kin{border-color:var(--accent)}
.plane.tiny .box i{display:none}
.plane.tiny .box b{font-size:17px}
.plane.tiny .box .thumb{display:none}
.plane.tiny .box{grid-template-columns:minmax(0,1fr)}
.plane.micro .box b{font-size:0}
.plane.micro .box i{display:none}
.plane.micro .box .thumb{display:none}
.plane.micro .box{background:var(--rule-2);border-color:var(--rule-2)}
.plane.micro .box.centre{background:var(--accent);border-color:var(--accent)}
.legend{
  flex:0 0 auto;display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  font-family:var(--sans);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:10px 0 0;
}
.legend s{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
/* An entry that hides itself needs this: the display above outranks the
   `hidden` attribute, so without it the linked key sits in the legend of every
   tree that has no link at all. */
.legend s[hidden]{display:none}
.legend .swatch{width:22px;height:13px;border:1px solid var(--rule-2);border-radius:2px;background:var(--card)}
.legend .swatch.blood{border-left:3px solid var(--accent)}
.legend .swatch.married{border-style:dashed;border-color:var(--heirat-line);background:var(--heirat-fill)}
.legend .swatch.indirect{border-style:dotted;border-color:var(--indirekt-line);background:var(--indirekt-fill)}
.legend .pickable{cursor:pointer;border-bottom:1px solid transparent;padding-bottom:1px}
.legend .pickable:hover{color:var(--ink-2)}
.legend .pickable[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.legend b{font-weight:500;color:var(--ink-2)}
.legend .swatch.linked{
  display:inline-flex;align-items:center;justify-content:center;
  border-style:solid;color:var(--accent);font-size:10px;line-height:1;
}

/* The mark in the box's bottom right corner: this person is also kept in
   another tree.  No opacity, no filter and no blend - inside the zoomed plane
   any of those would draw it through a buffer of its own and go soft. */
.linkmark{
  position:absolute;right:3px;bottom:2px;z-index:2;pointer-events:none;
  font-family:var(--sans);font-size:10px;line-height:1;color:var(--accent);
}
.plane.small .linkmark,.plane.micro .linkmark{display:none}

/* The two little menus beside the view buttons. */
.modewrap{position:relative;display:inline-flex;align-items:center;gap:2px}
.nearmore{padding:0 5px;min-width:0;font-size:11px}
.popover{
  position:absolute;top:calc(100% + 6px);left:0;z-index:40;
  display:flex;flex-direction:column;gap:7px;white-space:nowrap;
  background:var(--card);border:1px solid var(--rule-2);border-radius:4px;
  box-shadow:var(--shadow);padding:9px 11px;
  font-family:var(--sans);font-size:12.5px;letter-spacing:0;text-transform:none;
  color:var(--ink-2);
}
.popover[hidden]{display:none}
.popover label{display:flex;align-items:center;gap:7px;cursor:pointer}
.manual h3{margin-top:0}
.manual p{margin:0 0 10px;font-size:15.5px;line-height:1.6;color:var(--ink-2);max-width:62ch}
.manual p:last-child{margin-bottom:0}
.manual b{color:var(--ink);font-weight:500}
.manual ul{margin:0;padding:0;list-style:none}
.manual li{
  display:grid;grid-template-columns:168px minmax(0,1fr);gap:14px;
  padding:7px 0;border-bottom:1px dotted var(--rule);font-size:15.5px;color:var(--ink-2);
}
.manual li:last-child{border-bottom:0}
.manual li span:first-child{
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);padding-top:2px;
}
.manual .chipdemo{
  display:inline-block;border:1px solid var(--rule-2);border-radius:2px;
  padding:1px 7px;font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.legend .swatch.centre{border:2px solid var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.modes{display:flex;gap:0}
.modes .btn{border-radius:0;margin-left:-1px}
.modes .btn:first-child{border-radius:2px 0 0 2px}
.modes .btn:last-child{border-radius:0 2px 2px 0}
.modes .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.box .info{
  position:absolute;top:5px;right:5px;
  border:1px solid var(--rule-2);background:var(--paper-2);color:var(--ink-3);
  font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  line-height:1;padding:4px 5px;border-radius:2px;cursor:pointer;transition:.15s;
}
.box .info:hover{color:var(--paper);background:var(--accent);border-color:var(--accent)}

/* ---- adding a relative straight from the diagram -------------------------
   Four buttons on the four edges of the box that was last clicked: above the
   parents, below the children, left and right the siblings - the directions
   the tree itself is drawn in, so the button sits where the person will land.
   Hidden until the mouse is over that box, and shown by `display` rather than
   by fading: anything half-transparent over the diagram makes the type in the
   boxes behind it go soft. */
.box .adds{position:absolute;inset:0;pointer-events:none}
.box .add{
  position:absolute;display:none;place-items:center;pointer-events:auto;
  width:26px;height:26px;padding:0;border-radius:50%;cursor:pointer;
  border:1px solid var(--accent);background:var(--paper);color:var(--accent);
  font-family:var(--sans);font-size:17px;line-height:1;
  box-shadow:0 2px 7px rgba(0,0,0,.35);
}
.box.armed:hover .add{display:grid}
.box .add:hover{background:var(--accent);color:var(--paper)}
.box .add.up{top:-14px;left:50%;margin-left:-13px}
.box .add.down{bottom:-14px;left:50%;margin-left:-13px}
.box .add.left{left:-14px;top:50%;margin-top:-13px}
.box .add.right{right:-14px;top:50%;margin-top:-13px}
/* At the far zoom levels a box is a block a few pixels tall - a button there
   would cover the person it belongs to. */
.plane.tiny .box.armed:hover .add,
.plane.micro .box.armed:hover .add{display:none}

/* the three kinds of relative, told apart by fill, border and left edge */
.box.blut{background:var(--card);border-left:3px solid var(--rule-2)}
.box.blut.up{border-left-color:var(--male)}
.box.blut.down{border-left-color:var(--female)}
.box.blut.side{border-left-color:var(--accent)}
.box.heirat{
  background:var(--heirat-fill);border-style:dashed;border-color:var(--heirat-line);
  border-left:3px dashed var(--heirat-line);
}
.box.indirekt{
  background:var(--indirekt-fill);border-style:dotted;border-color:var(--indirekt-line);
  border-left:3px dotted var(--indirekt-line);
}
.box.indirekt b{color:var(--ink-2)}
.plane[data-only] .wires path{stroke:var(--line-dim)}
.plane[data-only="blut"] .box.blut::after,
.plane[data-only="heirat"] .box.heirat::after,
.plane[data-only="indirekt"] .box.indirekt::after,
.plane[data-only] .box.centre::after{display:none}

/* a family that married in, drawn as one island */
.hull{
  position:absolute;border:1px dashed var(--indirekt-line);border-radius:14px;
  background:var(--hull-fill);pointer-events:none;
}
.hull-label{
  position:absolute;top:-11px;left:14px;background:var(--paper);
  font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--indirekt-line);border:1px solid var(--indirekt-line);border-radius:2px;
  padding:2px 8px;white-space:nowrap;
}
.plane[data-design="tafel"] .hull{display:none}
.stagewrap{position:relative}
.rail{
  position:absolute;left:1px;top:1px;bottom:1px;width:190px;pointer-events:none;
  overflow:hidden;z-index:4;
}
.tier{
  position:absolute;left:8px;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);white-space:nowrap;line-height:1.1;
  background:color-mix(in srgb,var(--paper-2) 88%,transparent);
  border:1px solid var(--rule);border-left:2px solid var(--accent);
  border-radius:0 2px 2px 0;padding:3px 8px 3px 7px;
}
/* One row, on purpose.  Every control keeps its size and the name in the
   middle is the only thing allowed to give way - it is spelled out in the
   masthead anyway, so an ellipsis there costs nothing.  Below 1240px the row
   is allowed to break again rather than push the zoom off the edge. */
.stagebar{
  display:flex;align-items:center;gap:10px;flex-wrap:nowrap;margin-bottom:9px;
  position:relative;z-index:10;
}
.stagebar > *{flex:0 0 auto}
@media(max-width:1240px){.stagebar{flex-wrap:wrap}}
.stagebar .who{
  font-size:19px;min-width:72px;flex:0 1 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stagebar .who b{font-weight:500}
.stagebar .who span{
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-left:10px;
}
.zoom{display:flex;gap:0;margin-left:auto}
.zoom .btn{border-radius:0;margin-left:-1px;min-width:34px;padding:6px 10px}
.zoom .btn:first-child{border-radius:2px 0 0 2px}
.zoom .btn:last-child{border-radius:0 2px 2px 0}
.empty{color:var(--ink-3);font-style:italic;padding:6px 0}

/* ------------------------------------------------------------------ modal */
.scrim{
  position:fixed;inset:0;z-index:200;background:rgba(24,20,14,.55);
  display:grid;place-items:start center;padding:44px 20px;overflow-y:auto;
  backdrop-filter:blur(3px);animation:fade .18s ease;
}
html[data-theme="abend"] .scrim{background:rgba(0,0,0,.7)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet{
  width:min(820px,100%);background:var(--paper);border:1px solid var(--rule-2);
  border-radius:3px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);
  animation:rise .24s cubic-bezier(.2,.8,.3,1);
}
.sheet-head{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:start;
  padding:24px 26px 20px;border-bottom:1px solid var(--rule);
}
.sheet-head .portrait{width:112px;height:142px;object-fit:cover;border-radius:1px;box-shadow:0 0 0 1px var(--rule-2)}
.sheet-head .portrait.mono{display:grid;place-items:center;font-family:var(--sans);font-size:30px;color:var(--ink-3);background:var(--paper-2)}
.sheet h2{margin:0;font-size:30px;font-weight:500;line-height:1.08;letter-spacing:-.01em}
.sheet .kicker{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.rel-badge{
  display:inline-block;margin-top:9px;padding:5px 11px;border:1px solid var(--accent);
  color:var(--accent);font-family:var(--sans);font-size:12.5px;letter-spacing:.09em;
  text-transform:uppercase;border-radius:2px;
}
.closer{
  border:0;background:none;font-size:24px;line-height:1;color:var(--ink-3);cursor:pointer;padding:2px 6px;
}
.closer:hover{color:var(--accent)}
.sheet-body{padding:6px 26px 26px}
.sec{padding:18px 0;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.sec h3{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 10px;font-weight:500;
}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 24px;margin:0}
.people-links{display:flex;flex-wrap:wrap;gap:7px}
.plink{
  font:inherit;font-size:15px;background:var(--card);border:1px solid var(--rule);
  padding:5px 11px;border-radius:2px;cursor:pointer;color:inherit;transition:.14s;
}
.plink:hover{border-color:var(--accent);color:var(--accent)}
.plink small{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);margin-left:6px;letter-spacing:.05em}
.plink:hover small{color:var(--accent)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:62px 108px minmax(0,1fr);gap:12px;padding:5px 0;border-bottom:1px dotted var(--rule)}
.timeline li:last-child{border-bottom:0}
.timeline .yr{font-family:var(--sans);font-size:14px;letter-spacing:.06em;color:var(--accent)}
.timeline .what{font-family:var(--sans);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.timeline .where{color:var(--ink-2);font-size:15.5px}
.prose{font-size:16px;line-height:1.62;color:var(--ink-2);margin:0}
.prose em{color:var(--ink);font-style:normal}
.path{list-style:none;margin:0;padding:0;font-size:15.5px}
.path li{padding:3px 0 3px 20px;position:relative;color:var(--ink-2)}
.path li::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:1px solid var(--rule-2)}
.path li:first-child::before{top:50%}
.path li:last-child::before{bottom:50%}
.path li::after{content:"";position:absolute;left:2px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--rule-2)}
.path li b{font-weight:500;color:var(--ink)}
.path li span{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:8px}
.note{font-size:15px;color:var(--ink-2);background:var(--paper-2);border-left:2px solid var(--rule-2);padding:8px 12px;margin:0 0 8px}
.check{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:9px 0;border-bottom:1px dotted var(--rule)}
.check:last-child{border-bottom:0}
.check .tag{
  font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--rule-2);border-radius:2px;padding:2px 0;text-align:center;height:fit-content;color:var(--ink-3);
}
.check .tag.Struktur{border-color:var(--accent);color:var(--accent)}
.check .tag.Datum{border-color:var(--accent);color:var(--accent)}
.check p{margin:0;font-size:15.5px;color:var(--ink-2)}
.legend{font-size:15px;color:var(--ink-2);margin:0 0 4px}
details.raw summary{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);cursor:pointer;margin-bottom:8px;
}
details.raw summary:hover{color:var(--ink-2)}
details.raw .prose{font-size:14.5px}
.footnote{color:var(--ink-3);font-family:var(--sans);font-size:11.5px;letter-spacing:.07em}
kbd{
  font-family:var(--sans);font-size:11px;border:1px solid var(--rule-2);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;color:var(--ink-2);
}

/* ------------------------------------------------------------------- editor
   Everything below only ever shows up when the page is running behind the
   local edit server; the file mailed to the family has `data-edit` unset and
   never paints a single one of these rules.  Nothing here sits inside #plane,
   so the ban on opacity and filter in the diagram is not touched. */
.editonly{display:none !important}
html[data-edit] .editonly{display:revert !important}
html[data-edit] .editonly.flex{display:flex !important}

/* one-line stage bar: the labels moved into tooltips of our own, because the
   native ones take about a second to show and cannot be styled to match */
.tipped{position:relative}
.tipped::after{
  content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);
  transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  background:var(--ink);color:var(--paper);font-family:var(--sans);
  font-size:11.5px;letter-spacing:.07em;text-transform:none;
  padding:5px 9px;border-radius:2px;box-shadow:var(--shadow);
  visibility:hidden;z-index:120;
}
.tipped:hover::after,.tipped:focus-visible::after{visibility:visible}
.tipped.tip-right::after{left:auto;right:0;transform:none}
.iconbtn{
  min-width:34px;padding:6px 9px;font-size:14px;letter-spacing:0;text-transform:none;
  font-family:var(--sans);line-height:1.15;
}
.helpdot{
  width:26px;height:26px;border-radius:50%;padding:0;font-size:14px;
  display:grid;place-items:center;flex:0 0 auto;
}

/* ---- the form the person sheet turns into ---- */
.sheet.editing{width:min(940px,100%)}
.sheet-foot{
  position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:14px 26px;border-top:1px solid var(--rule);background:var(--paper);
}
.sheet-foot .grow{flex:1 1 auto}
.saveinfo{font-family:var(--sans);font-size:12px;letter-spacing:.07em;color:var(--ink-3)}
.saveinfo.warn{color:var(--accent)}

.fields{display:grid;gap:12px}
.fields.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fields.three{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span{
  font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);
}
.field input,.field select,.field textarea{
  font-family:var(--serif);font-size:15.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--rule-2);border-radius:2px;padding:7px 9px;width:100%;
}
.field textarea{resize:vertical;min-height:92px;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;
}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-3)}
.field.check{flex-direction:row;align-items:center;gap:8px}
.field.check input{width:auto}
.field.check span{text-transform:none;letter-spacing:.04em;font-size:12.5px;color:var(--ink-2)}
.hintline{font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;color:var(--ink-3);margin:2px 0 0}

/* a date is three little boxes, not a date picker: most of these people are
   known by a year alone, and a picker insists on a full one */
.datebox{display:grid;grid-template-columns:52px 62px 74px;gap:6px}
.datebox input{text-align:center}

/* ---- repeatable blocks: residences, life events, documents ---- */
.stack{display:grid;gap:10px}
.card{
  border:1px solid var(--rule);background:var(--card);border-radius:2px;padding:12px;
  display:grid;gap:10px;position:relative;
}
.card .drop{
  position:absolute;top:6px;right:6px;border:0;background:none;color:var(--ink-3);
  font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:2px;
}
.card .drop:hover{color:var(--accent);background:var(--paper-2)}
.addbtn{justify-self:start;font-size:12px}

/* ---- picking a person ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipx{
  display:inline-flex;align-items:center;gap:7px;font-size:14.5px;
  background:var(--card);border:1px solid var(--rule-2);border-radius:2px;padding:4px 6px 4px 10px;
}
.chipx small{font-family:var(--sans);font-size:11px;color:var(--ink-3);letter-spacing:.05em}
.chipx button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:0 3px}
.chipx button:hover{color:var(--accent)}
.picker{position:relative;margin-top:8px}
.pickmenu{
  position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:262px;overflow-y:auto;
  background:var(--card);border:1px solid var(--rule-2);border-radius:2px;box-shadow:var(--shadow);
}
.pickmenu button{
  display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);
  background:none;font:inherit;font-size:15px;color:inherit;padding:7px 11px;cursor:pointer;
}
.pickmenu button:last-child{border-bottom:0}
.pickmenu button:hover,.pickmenu button.on{background:var(--accent-soft);color:var(--ink)}
.pickmenu small{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);margin-left:8px;letter-spacing:.05em}
.pickmenu .make{color:var(--accent)}
/* the guessed-at second parent: on top, and marked as a guess */
.pickmenu .suggest{background:var(--paper-2);border-bottom:1px solid var(--rule-2)}
.pickmenu .suggest small{color:var(--accent)}
/* what the program made of a folder somebody typed - shown while they type */
.erkannt{
  margin:8px 0 0;font-family:var(--sans);font-size:12.5px;line-height:1.5;
  color:var(--ink-2);min-height:1.2em;
}
.erkannt[data-art="daten"],.erkannt[data-art="baeume"],.erkannt[data-art="baum"]{color:var(--accent)}
.erkannt[data-art="fehlt"]{color:var(--warn,var(--ink-2))}
/* File or folder - the same dialog answers both, and which one is being
   answered has to be visible at a glance rather than guessed from the fields. */
.quelle{display:flex;gap:8px;flex-wrap:wrap}
.quellknopf.an{border-color:var(--accent);color:var(--accent)}
.ordnerzeile{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.ordnerzeile input{
  flex:1 1 320px;min-width:0;font:inherit;font-size:15px;padding:7px 10px;
  border:1px solid var(--rule);border-radius:2px;background:var(--paper);
  color:var(--ink);font-family:var(--mono,var(--sans));
}
.ordnerzeile .btn{flex:0 0 auto}
/* The spouse, offered by name under the search field - one click, no typing
   and no menu to open first. */
.offers{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.offer{
  display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14.5px;
  border:1px solid var(--accent);border-radius:2px;padding:5px 11px;cursor:pointer;
  background:var(--card);color:var(--accent);
}
.offer:hover{background:var(--accent);color:var(--paper)}

/* ---- portrait and documents ---- */
.shot{display:flex;gap:16px;align-items:flex-start}
.shot .portrait{width:96px;height:122px;object-fit:cover;border-radius:1px;box-shadow:0 0 0 1px var(--rule-2)}
.shot .portrait.mono{display:grid;place-items:center;font-family:var(--sans);font-size:26px;color:var(--ink-3);background:var(--paper-2)}
/* what a move would do, one line per thing that travels */
.movelist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.movelist li{
  border:1px solid var(--rule);background:var(--card);border-radius:2px;padding:8px 11px;
  display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
}
.movelist b{font-weight:500}
.movelist small{font-family:var(--sans);font-size:12px;color:var(--ink-3);letter-spacing:.04em}

.docrow{
  display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:11px;align-items:center;
  border:1px solid var(--rule);background:var(--card);border-radius:2px;padding:8px 10px;
}
.docrow .kind{font-family:var(--sans);font-size:15px;color:var(--ink-3);text-align:center}
.docrow a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule-2)}
.docrow a:hover{color:var(--accent);border-color:var(--accent)}
.docrow small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);letter-spacing:.05em}

/* ---- word from the program, bottom right ---- */
.toast{
  position:fixed;right:22px;bottom:22px;z-index:400;max-width:min(420px,80vw);
  background:var(--ink);color:var(--paper);border-radius:3px;padding:12px 16px;
  font-family:var(--sans);font-size:13.5px;letter-spacing:.04em;box-shadow:var(--shadow);
  animation:rise .2s cubic-bezier(.2,.8,.3,1);
}
.toast.bad{background:var(--accent);color:#fff}

/* Shown when the back end is gone.  Fixed to the top and not dismissable:
   every button in the window is useless until the program is started again,
   and saying so once is kinder than failing at each of them. */
.abriss{
  position:fixed;left:0;right:0;top:0;z-index:500;
  background:var(--accent);color:#fff;padding:11px 22px;
  font-family:var(--sans);font-size:13.5px;letter-spacing:.04em;
  display:flex;gap:14px;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.35);
}
.abriss b{font-weight:600}
.abriss span{opacity:1}
</style>
</head>
<body>

<header class="masthead">
  <div>
    <h1 id="mastTitle"></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="spacer"></div>
  <div class="tools">
    <!-- Filled by applyJump when this tree was reached by following a link,
         empty otherwise. It names the tree it goes back to, and it returns to
         the person the jump started from rather than to whatever was last the
         centre over there. -->
    <span id="backBar" hidden></span>
    <button class="btn" id="helpBtn">Anleitung</button>
    <button class="btn" id="checkBtn">Prüfbericht</button>
    <button class="btn editonly" id="importBtn">Importieren</button>
    <button class="btn editonly" id="exportBtn">Exportieren</button>
    <button class="btn editonly" id="optionsBtn">Optionen</button>
    <button class="btn" id="rootBtn"></button>
    <button class="btn" id="themeBtn">Abendlicht</button>
  </div>
</header>

<div class="shell">
  <aside class="register">
    <div class="searchbox">
      <input id="q" type="search" placeholder="Person, Ort oder Jahr suchen …" autocomplete="off" spellcheck="false">
      <div class="filters">
        <button class="chip" data-filter="alle" aria-pressed="true">Alle</button>
        <button class="chip" data-filter="foto" aria-pressed="false">Mit Foto</button>
        <button class="chip" data-filter="verwandt" aria-pressed="false">Verwandt</button>
        <button class="chip" data-filter="jahr" aria-pressed="false">Nach Jahr</button>
      </div>
    </div>
    <div class="counter" id="counter"></div>
    <div class="list" id="list"></div>
  </aside>

  <main class="canvas">
    <div class="stagebar">
      <button class="btn primary editonly tipped" id="addBtn"
              data-tip="Eine Person anlegen, die im Bericht von 2023 noch fehlt">＋ Person</button>
      <div class="who" id="who"></div>
      <button class="btn helpdot tipped" id="hintDot" aria-label="Bedienung"
              data-tip="Kasten anklicken = Mittelpunkt · ⓘ = Personenblatt · ziehen verschiebt, Mausrad zoomt">?</button>
      <div class="modes" id="designs">
        <button class="btn tipped" data-design="tafel" aria-pressed="true" data-tip="Alle gleich gezeichnet, wie eine gedruckte Ahnentafel">Tafel</button>
        <button class="btn tipped" data-design="sippen" aria-pressed="false" data-tip="Eingeheiratete Familien als eigene Inseln mit Namen">Sippen</button>
      </div>
      <div class="modes" id="modes">
        <span class="modewrap">
          <button class="btn tipped" data-mode="nah" aria-pressed="true" data-tip="Drei Generationen um den Mittelpunkt">Nahe Familie</button>
          <!-- Who else counts as "near" is a question that exists without any
               link: a brother-in-law is in this tree already.  So the menu
               belongs to the view and applies to everybody, rather than being
               a second set of rules for linked people only. -->
          <button class="btn iconbtn nearmore" id="nearMore" aria-expanded="false"
                  title="Wer noch zur nahen Familie zählt">▾</button>
          <span class="popover" id="nearMenu" hidden>
            <label><input type="checkbox" data-near="schwiegergross"> Schwiegergroßeltern</label>
            <label><input type="checkbox" data-near="schwager"> Schwager und Schwägerin</label>
            <label><input type="checkbox" data-near="neffen"> Angeheiratete Neffen und Nichten</label>
          </span>
        </span>
        <button class="btn tipped" data-mode="ahnen" aria-pressed="false" data-tip="Nur die Vorfahren – die einzige Ansicht ganz ohne Kreuzungen">Ahnentafel</button>
        <button class="btn tipped" data-mode="blut" aria-pressed="false" data-tip="Alle Blutsverwandten des Mittelpunkts">Ganze Linie</button>
        <span class="modewrap">
          <button class="btn tipped" data-mode="alle" aria-pressed="false" data-tip="Alle im Baum und wer eingeheiratet hat – nicht die Familien aus verknüpften Stammbäumen">Alle</button>
          <span class="popover" id="alleMenu" hidden>
            <label><input type="checkbox" id="showLinked"> Verknüpfte Personen mit anzeigen</label>
          </span>
        </span>
      </div>
      <div class="zoom">
        <button class="btn iconbtn tipped" id="zoomOut" data-tip="Kleiner">−</button>
        <button class="btn iconbtn tipped" id="zoomFit" data-tip="Ganzen Baum einpassen">⤢</button>
        <button class="btn iconbtn tipped" id="zoomReset" data-tip="Originalgröße">1:1</button>
        <button class="btn iconbtn tipped tip-right" id="zoomIn" data-tip="Größer">+</button>
      </div>
    </div>
    <div class="stagewrap">
      <div class="stage" id="stage"><div class="pan" id="pan"><div class="plane" id="plane"></div></div></div>
      <div class="rail" id="rail"></div>
    </div>
    <p class="legend">
      <s><span class="swatch centre"></span> Mittelpunkt</s>
      <s class="pickable" data-only="blut" title="Nur Blutsverwandte hervorheben"><span class="swatch blood"></span> blutsverwandt <b id="cBlut"></b></s>
      <s class="pickable" data-only="heirat" title="Nur Angeheiratete hervorheben"><span class="swatch married"></span> angeheiratet <b id="cHeirat"></b></s>
      <s class="pickable" data-only="indirekt" title="Nur deren Familien hervorheben"><span class="swatch indirect"></span> deren Familie <b id="cIndirekt"></b></s>
      <s id="legendLinked" hidden title="Diese Person wird in einem zweiten Stammbaum geführt – dort steht ihre eigene Familie"><span class="swatch linked">⧉</span> auch in anderem Stammbaum <b id="cLinked"></b></s>
      <s id="legendCount"></s>
      <s class="footnote" id="footer" style="margin-left:auto"></s>
    </p>
  </main>
</div>


<script>
const DATA = __DATA__;
const PHOTOS = __PHOTOS__;

/* The program's own version, not the tree's.  It travels into every exported
   page, so a file found again in five years still says what made it.

   This line is the **only** place the number is written down. The editor reads
   it from here and so does the exe builder, which stamps it into the file
   properties. It lives in the template rather than in a Python file because
   this page has to carry it with no program behind it - and a number kept in
   two places is a number that will eventually disagree with itself. */
const VERSION = "1.2.1";

/* ------------------------------------------------------------------ setup */
const BY_ID = new Map(DATA.people.map(p => [p.id, p]));

/* Who the tree opens on: nobody.  A family has no natural middle, and writing
   one into the file would put that person in front of every reader, on every
   open, for good.  So the page starts with the whole tree on screen and
   nothing marked; a centre exists from the moment somebody picks one, by
   clicking a box or by saying once "that is me".

   Where that choice is kept depends on who is looking.  In the editor it is
   `meta.root` - the owner's own setting, saved with the tree.  The copy that
   travels around the family ignores that field on purpose, so that nobody
   inherits somebody else's middle: there the choice lives in the reader's own
   browser and never touches the file. */
const IS_EDIT = !!window.STAMMBAUM_EDIT;
const ME_KEY = "stammbaum:ich:" + (DATA.meta.title || "baum");

function storedMe(){
  if(IS_EDIT) return DATA.meta.root ?? null;
  try{
    const raw = localStorage.getItem(ME_KEY);
    return raw === null ? null : +raw;
  }catch(_){ return null; }        // a browser with storage switched off just forgets
}

let ME = storedMe();
if(ME !== null && !BY_ID.has(ME)) ME = null;
let centre = ME;
let filter = "alle";
let query = "";

const MONTHS = ["", "Januar", "Februar", "März", "April", "Mai", "Juni", "Juli",
                "August", "September", "Oktober", "November", "Dezember"];

const fold = s => (s || "").toLowerCase()
  .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
  .normalize("NFD").replace(/[̀-ͯ]/g, "");

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function initials(p){
  const parts = (p.name || "?").split(/\s+/).filter(w => /^[A-Za-zÄÖÜäöüß]/.test(w));
  const first = parts[0] || "?";
  const last = parts.length > 1 ? parts[parts.length - 1] : "";
  return (first[0] + (last[0] || "")).toUpperCase();
}

function dateText(d){
  if(!d) return "";
  const bits = [];
  if(d.day && d.month) bits.push(d.day + ". " + MONTHS[d.month]);
  else if(d.month) bits.push(MONTHS[d.month]);
  if(d.year) bits.push(String(d.year));
  let out = bits.join(" ");
  if(d.approx && out) out = "um " + out;
  if(!out && d.note) out = d.note;
  return out;
}
function fullEvent(d){
  const when = dateText(d);
  if(!d) return "";
  if(when && d.place) return when + ", " + d.place;
  return when || d.place || "";
}
function lifespan(p){
  const b = p.birth && p.birth.year, d = p.death && p.death.year;
  if(b && d) return b + "–" + d;
  if(b) return "* " + b;
  if(d) return "† " + d;
  if(p.death) return "†";
  return "";
}

/* ------------------------------------------------------------- kinship maths
   Mirrors tools/kinship.py.  Keep the two in step. */
const ancCache = new Map();
function ancestors(id){
  if(ancCache.has(id)) return ancCache.get(id);
  const out = new Map([[id, 0]]);
  let frontier = [id], depth = 0;
  while(frontier.length && depth < 40){
    depth++;
    const next = [];
    for(const pid of frontier){
      const person = BY_ID.get(pid);
      if(!person) continue;
      for(const parent of person.parents){
        if(BY_ID.has(parent) && !out.has(parent)){ out.set(parent, depth); next.push(parent); }
      }
    }
    frontier = next;
  }
  ancCache.set(id, out);
  return out;
}

const MF = (p, m, w) => (p.sex === "w" ? w : m);

function upWord(p, n){
  if(n === 1) return MF(p, "Vater", "Mutter");
  if(n === 2) return MF(p, "Großvater", "Großmutter");
  if(n === 3) return MF(p, "Urgroßvater", "Urgroßmutter");
  return (n - 2) + "× Ur-" + MF(p, "Großvater", "Großmutter");
}
function downWord(p, n){
  if(n === 1) return MF(p, "Sohn", "Tochter");
  if(n === 2) return MF(p, "Enkel", "Enkelin");
  if(n === 3) return MF(p, "Urenkel", "Urenkelin");
  return (n - 2) + "× Ur-" + MF(p, "Enkel", "Enkelin");
}
function auntWord(p, n){
  if(n === 2) return MF(p, "Onkel", "Tante");
  if(n === 3) return MF(p, "Großonkel", "Großtante");
  if(n === 4) return MF(p, "Urgroßonkel", "Urgroßtante");
  return (n - 3) + "× Ur-" + MF(p, "Großonkel", "Großtante");
}
function nephewWord(p, n){
  if(n === 2) return MF(p, "Neffe", "Nichte");
  if(n === 3) return MF(p, "Großneffe", "Großnichte");
  if(n === 4) return MF(p, "Urgroßneffe", "Urgroßnichte");
  return (n - 3) + "× Ur-" + MF(p, "Großneffe", "Großnichte");
}

/** Best common ancestor of a and b, as {anc, up, down} or null. */
function meet(a, b){
  const A = ancestors(a), B = ancestors(b);
  let best = null;
  for(const [anc, up] of A){
    const down = B.get(anc);
    if(down === undefined) continue;
    const total = up + down;
    if(!best || total < best.total || (total === best.total && Math.abs(up - down) < Math.abs(best.up - best.down))){
      best = {anc, up, down, total};
    }
  }
  return best;
}

/** How is `other` related to `from`?  Returns {label, kind} or null. */
function bloodRelation(from, other){
  if(from === other) return {label: "Mittelpunkt", kind: "self", total: 0};
  const a = BY_ID.get(from), b = BY_ID.get(other);
  if(!a || !b) return null;
  const m = meet(from, other);
  if(!m) return null;
  const up = m.up, down = m.down;

  const total = up + down;
  if(up === 0) return {label: downWord(b, down), kind: "ab", total};
  if(down === 0) return {label: upWord(b, up), kind: "auf", total};
  if(up === 1 && down === 1){
    const shared = a.parents.filter(p => b.parents.includes(p)).length;
    const half = shared < 2 && a.parents.length && b.parents.length ? "Halb" : "";
    return {label: half + MF(b, "bruder", "schwester").replace(/^./, c => half ? c : c.toUpperCase()), kind: "geschwister", total};
  }
  if(up === 1) return {label: nephewWord(b, down), kind: "seitlich", total};
  if(down === 1) return {label: auntWord(b, up), kind: "seitlich", total};
  const grade = Math.min(up, down) - 1;
  const removed = Math.abs(up - down);
  let label = MF(b, "Cousin", "Cousine") + " " + grade + ". Grades";
  if(removed) label += " · " + removed + " Generation" + (removed > 1 ? "en" : "") + " entfernt";
  return {label, kind: "cousin", total};
}

const firstName = id => (BY_ID.get(id) || {name: ""}).name.split(" ")[0];
const siblingsOf = id => {
  const p = BY_ID.get(id);
  const out = [];
  for(const parent of p.parents)
    for(const c of (BY_ID.get(parent) || {children: []}).children)
      if(c !== id && !out.includes(c)) out.push(c);
  return out;
};

/** Full answer including in-laws, which the blood test alone cannot see.
 *  Everyday German has proper words for the near cases; further out the label
 *  says plainly which marriage the connection runs through. */
function relation(from, other){
  const direct = bloodRelation(from, other);
  if(direct) return direct;
  const a = BY_ID.get(from), b = BY_ID.get(other);
  if(!a || !b) return null;

  if(a.spouses.includes(other)) return {label: MF(b, "Ehemann", "Ehefrau"), kind: "ehe"};

  const mySiblings = siblingsOf(from);
  for(const s of mySiblings)
    if(BY_ID.get(s).spouses.includes(other))
      return {label: MF(b, "Schwager", "Schwägerin"), kind: "angeheiratet", via: s};
  for(const s of a.spouses)
    if(siblingsOf(s).includes(other))
      return {label: MF(b, "Schwager", "Schwägerin"), kind: "angeheiratet", via: s};
  for(const c of a.children)
    if((BY_ID.get(c) || {spouses: []}).spouses.includes(other))
      return {label: MF(b, "Schwiegersohn", "Schwiegertochter"), kind: "angeheiratet", via: c};
  for(const s of a.spouses)
    if((BY_ID.get(s) || {parents: []}).parents.includes(other))
      return {label: MF(b, "Schwiegervater", "Schwiegermutter"), kind: "angeheiratet", via: s};
  for(const parent of a.parents)
    if((BY_ID.get(parent) || {spouses: []}).spouses.includes(other) && !a.parents.includes(other))
      return {label: MF(b, "Stiefvater", "Stiefmutter"), kind: "angeheiratet", via: parent};
  for(const s of a.spouses)
    if((BY_ID.get(s) || {children: []}).children.includes(other) && !a.children.includes(other))
      return {label: MF(b, "Stiefsohn", "Stieftochter"), kind: "angeheiratet", via: s};

  // other married into the family
  let best = null;
  for(const via of b.spouses){
    const r = bloodRelation(from, via);
    if(r && (!best || r.total < best.r.total)) best = {r, via};
  }
  if(best) return {label: MF(b, "Mann", "Frau") + " von " + firstName(best.via),
                   kind: "angeheiratet", via: best.via, note: best.r.label};

  // the link runs through the centre's own marriage
  for(const mine of a.spouses){
    const r = bloodRelation(mine, other);
    if(r) return {label: r.label + " von " + firstName(mine),
                  kind: "angeheiratet", via: mine, note: "über die Ehe mit " + firstName(mine)};
    for(const via of b.spouses){
      const r2 = bloodRelation(mine, via);
      if(r2) return {label: MF(b, "Mann", "Frau") + " von " + firstName(via),
                     kind: "angeheiratet", via,
                     note: firstName(via) + " ist " + r2.label + " von " + firstName(mine)};
    }
  }
  return null;
}

/** Last resort: the label the report printed, seen from whoever it was written for. */
function anyRelation(from, other){
  // With nobody in the middle there is nothing to measure from, and the label
  // the report brought along is all there is to show.
  const r = from === null ? null : relation(from, other);
  if(r) return r;
  const p = BY_ID.get(other);
  if(p && p.relation) return {label: p.relation, kind: "bericht"};
  return null;
}

/** The chain of steps from a to b, for the detail sheet. */
function relationPath(from, other){
  if(from === other) return [];
  const m = meet(from, other);
  if(!m) return null;
  const legUp = [], legDown = [];
  let cur = from;
  for(let i = 0; i < m.up; i++){
    const person = BY_ID.get(cur);
    const next = person.parents.find(p => ancestors(p).has(m.anc)) ?? person.parents[0];
    if(next === undefined) break;
    legUp.push({id: next, step: MF(BY_ID.get(next), "Vater", "Mutter")});
    cur = next;
  }
  cur = other;
  for(let i = 0; i < m.down; i++){
    const person = BY_ID.get(cur);
    const next = person.parents.find(p => ancestors(p).has(m.anc)) ?? person.parents[0];
    if(next === undefined) break;
    legDown.push({id: cur, step: MF(BY_ID.get(cur), "Sohn", "Tochter")});
    cur = next;
  }
  legDown.reverse();
  return legUp.concat(legDown);
}

/* -------------------------------------------------------------- rendering */
function avatarHTML(p, cls){
  const src = PHOTOS[p.id];
  const gone = isGone(p) ? " gone" : "";
  if(src) return `<img class="${cls}${gone}" src="${src}" alt="${esc(p.name)}" loading="lazy">`;
  return `<div class="${cls} mono" aria-hidden="true">${esc(initials(p))}</div>`;
}

function renderList(){
  const list = document.getElementById("list");
  const q = fold(query);
  const rows = [];
  for(const p of DATA.people){
    if(filter === "foto" && !PHOTOS[p.id]) continue;
    const rel = anyRelation(centre, p.id);
    if(filter === "verwandt" && (!rel || rel.kind === "self" || rel.kind === "bericht")) continue;
    if(q){
      const hay = fold([p.name, p.surname, p.relation, p.occupation,
                        (p.birth || {}).place, (p.death || {}).place,
                        (p.birth || {}).year, (p.death || {}).year,
                        ...p.events.map(e => e.place || "")].join(" "));
      if(!hay.includes(q)) continue;
    }
    rows.push({p, rel});
  }
  if(filter === "jahr"){
    rows.sort((a, b) => (((a.p.birth || {}).year) || 9999) - (((b.p.birth || {}).year) || 9999));
  }
  document.getElementById("counter").textContent =
    rows.length + (rows.length === 1 ? " Person" : " Personen") +
    (rows.length !== DATA.people.length ? " von " + DATA.people.length : "");

  list.innerHTML = rows.map(({p, rel}) => `
    <button class="row${p.id === centre ? " is-centre" : ""}" data-open="${p.id}">
      ${avatarHTML(p, "avatar")}
      <span>
        <span class="row-name">${esc(p.name)}</span>
        <span class="row-meta">
          <span class="sex ${p.sex || ""}">${p.sex === "w" ? "♀" : p.sex === "m" ? "♂" : "·"}</span>
          <span>${esc(lifespan(p)) || "—"}</span>
          <span class="row-rel${rel && rel.kind === "bericht" ? " weak" : ""}">${esc(rel ? (rel.kind === "bericht" ? "laut Bericht: " + rel.label : rel.label) : "keine Verbindung")}</span>
        </span>
      </span>
    </button>`).join("") || `<p class="empty" style="padding:18px">${
      filter === "verwandt" && centre === null
        ? "Verwandtschaft wird vom Mittelpunkt aus gerechnet \u2013 dafür muss erst jemand ausgewählt sein."
        : "Nichts gefunden."}</p>`;
}

/* ------------------------------------------------------------------ diagram
   People are grouped into units - one person together with their partners, so
   a couple always stays side by side.  Units are stacked into generations and
   then nudged sideways until parents sit above their children.  That is enough
   structure to draw the whole file at once without the rows crossing. */
const NW = 208, NH = 74, PARTNER_GAP = 30, UNIT_GAP = 26, ROW_GAP = 158, PAD = 90;
const LANE_TOP = 16, LANE_STEP = 11, HOP = 5;
// the generation labels float over the left edge of the stage - keep clear of them
const RAIL_W = 200;

/* "Three generations around the centre" means nothing while there is no
   centre, so a fresh page starts as the whole tree and hands over to the near
   view the moment somebody is picked. */
let mode = centre === null ? "alle" : "nah";

/* ---- which people are on the stage -------------------------------------- */
/* A blood relative is anyone descended from one of the centre's ancestors -
   which is the centre's own line, their siblings, cousins and all descendants.
   Walking parents and children together would be wrong: from a child one would
   step up into the other parent, and every in-law would count as blood. */
const bloodCache = new Map();
function bloodSet(id){
  if(bloodCache.has(id)) return bloodCache.get(id);
  const out = new Set();
  const stack = [];
  for(const a of ancestors(id).keys()){ out.add(a); stack.push(a); }
  while(stack.length){
    const cur = stack.pop();
    for(const c of BY_ID.get(cur).children)
      if(BY_ID.has(c) && !out.has(c)){ out.add(c); stack.push(c); }
  }
  bloodCache.set(id, out);
  return out;
}
/* ---- the same person in another tree -------------------------------------
   Everything here reads `p.link` and nothing else.  Somebody who is only in
   this tree has none, so every one of these answers false for almost everybody
   and the diagram behaves exactly as it did before links existed.

   Declared here, above the view rules and the drawing, because that is where
   they are first used.  They read `window.STAMMBAUM_EDIT` rather than the
   `EDIT` const, which is initialised much further down: in the family's copy
   of the page that object does not exist at all, and every one of these then
   degrades to "not linked" instead of throwing. */
const openSlug = () => ((window.STAMMBAUM_EDIT || {}).offen)
                    || ((DATA.meta || {}).slug) || "";
const linkOf = p => (p && p.link && typeof p.link === "object") ? p.link : null;
const otherTrees = p => ((linkOf(p) || {}).trees || [])
  .filter(t => t && t.slug && t.slug !== openSlug());
const linkedElsewhere = p => otherTrees(p).length > 0;
/* Arrived as somebody else's relative rather than in their own right.  This is
   the flag the big views filter on - see alleSet. */
const borrowed = p => !!(linkOf(p) || {}).via;
const hiddenHere = p => !!(linkOf(p) || {}).hidden;
const treeTitle = slug => {
  const list = ((window.STAMMBAUM_EDIT || {}).baeume) || [];
  const found = list.find(t => t.slug === slug);
  return (found && found.titel) || slug;
};

/* Whether the big view also draws the married-in families that live in
   another tree, and which optional degrees the near view reaches.  Both are
   per reader and per browser - they change what is on screen, never the file. */
let showLinked = false;
const nearExtra = {schwiegergross: false, schwager: false, neffen: false};

function nearSet(id){
  const seen = new Set([id]);
  const add = x => { if(BY_ID.has(x)) seen.add(x); };
  const p = BY_ID.get(id);
  for(const parent of p.parents){
    add(parent);
    for(const gp of (BY_ID.get(parent) || {parents: []}).parents){
      add(gp);
      for(const ggp of (BY_ID.get(gp) || {parents: []}).parents) add(ggp);
    }
    for(const sib of (BY_ID.get(parent) || {children: []}).children) add(sib);
  }
  for(const child of p.children){
    add(child);
    for(const gc of (BY_ID.get(child) || {children: []}).children) add(gc);
  }
  // partners of everybody already on the stage, plus the centre's own in-laws
  for(const x of Array.from(seen))
    for(const s of BY_ID.get(x).spouses) add(s);
  for(const s of p.spouses)
    for(const parent of (BY_ID.get(s) || {parents: []}).parents) add(parent);

  /* The three optional degrees.  Off by default because the view is called
     "near family" and each of them widens it by a whole branch; on when
     somebody says so, for everybody in the tree and not only for the people
     who happen to be linked. */
  if(nearExtra.schwiegergross)
    for(const s of p.spouses)
      for(const parent of (BY_ID.get(s) || {parents: []}).parents)
        for(const gp of (BY_ID.get(parent) || {parents: []}).parents) add(gp);
  if(nearExtra.schwager){
    // the partner's own siblings, and the partners of the centre's siblings
    for(const s of p.spouses)
      for(const parent of (BY_ID.get(s) || {parents: []}).parents)
        for(const sib of (BY_ID.get(parent) || {children: []}).children) add(sib);
    for(const parent of p.parents)
      for(const sib of (BY_ID.get(parent) || {children: []}).children)
        for(const sp of (BY_ID.get(sib) || {spouses: []}).spouses) add(sp);
  }
  if(nearExtra.neffen)
    for(const parent of p.parents)
      for(const sib of (BY_ID.get(parent) || {children: []}).children){
        if(sib === id) continue;
        for(const kid of (BY_ID.get(sib) || {children: []}).children){
          add(kid);
          for(const sp of (BY_ID.get(kid) || {spouses: []}).spouses) add(sp);
        }
      }
  return seen;
}
/* "Alle" means this tree's own people plus who married into it - and stops
   there.  A borrowed person is somebody who arrived as a linked relative's
   family; they belong to the other tree and are only ever drawn where the
   relationship actually reaches them, which is the near view.

   The one exception is the rule stated plainly: nothing higher than
   married-in.  A borrowed person who is the partner of somebody in this tree
   IS married-in and stays; so does a child of that partner, which is the
   step-parent case - the child came with them and is part of this household.
   Their parents are one step further out and drop off.

   Without this the whole point of splitting the two families would be lost:
   open "Alle" and the second family stands in the middle of the first. */
function alleSet(){
  const keep = new Set();
  const own = [];
  for(const p of DATA.people){
    if(!borrowed(p)){ keep.add(p.id); own.push(p.id); }
  }
  const married = new Set();
  for(const id of own)
    for(const s of (BY_ID.get(id) || {spouses: []}).spouses)
      if(BY_ID.has(s) && !keep.has(s)){ keep.add(s); married.add(s); }
  // the step-parent's own child: one step down from a married-in partner,
  // never one step up
  for(const id of married)
    for(const kid of (BY_ID.get(id) || {children: []}).children)
      if(BY_ID.has(kid)) keep.add(kid);
  return keep;
}

/* Somebody nobody in this tree is joined to. They are kept - a partner who was
   entered but never connected is exactly how a real gap gets noticed - but the
   diagram sets them apart rather than mixing them into the family. */
function looseSet(){
  const loose = new Set();
  for(const p of DATA.people){
    if(borrowed(p)) continue;
    if(!(p.parents || []).length && !(p.spouses || []).length && !(p.children || []).length)
      loose.add(p.id);
  }
  return loose;
}

function stageSet(){
  const drop = set => {
    // A person hidden in this tree is not drawn anywhere, ever. The centre is
    // the one exception: having asked for somebody explicitly, being shown an
    // empty stage instead would read as a broken program.
    for(const id of Array.from(set)){
      const p = BY_ID.get(id);
      if(p && hiddenHere(p) && id !== centre) set.delete(id);
    }
    return set;
  };
  if(centre === null) return drop(new Set(DATA.people.map(p => p.id)));
  if(mode === "ahnen") return drop(new Set(ancestors(centre).keys()));
  if(mode === "alle"){
    // The switch is the way to see the married-in families anyway - off by
    // default, because the reason they are in another tree is that they make
    // this view unreadable.
    const seen = showLinked ? new Set(DATA.people.map(p => p.id)) : alleSet();
    seen.add(centre);
    return drop(seen);
  }
  if(mode === "blut"){
    const seen = bloodSet(centre);
    for(const x of Array.from(seen))
      for(const s of BY_ID.get(x).spouses) if(BY_ID.has(s)) seen.add(s);
    return drop(seen);
  }
  return drop(nearSet(centre));
}

/* ---- units --------------------------------------------------------------- */
function buildUnits(people){
  const home = new Map();                       // person -> unit
  const units = [];
  for(const id of Array.from(people).sort(byBirth)){
    if(home.has(id)) continue;
    const members = [id];
    for(const s of BY_ID.get(id).spouses)
      if(people.has(s) && !home.has(s) && !members.includes(s)) members.push(s);
    // a partner who already sits in a unit joins that one instead
    const joined = BY_ID.get(id).spouses.find(s => home.has(s));
    if(joined !== undefined && BY_ID.get(home.get(joined).main).spouses.length < 3){
      const unit = home.get(joined);
      unit.ids.push(id);
      home.set(id, unit);
      continue;
    }
    const unit = {main: id, ids: members, index: units.length};
    for(const m of members) home.set(m, unit);
    units.push(unit);
  }
  for(const unit of units){
    // the person with children belongs in the middle of a three-box unit
    if(unit.ids.length === 3){
      const middle = unit.ids.find(i => BY_ID.get(i).children.length) ?? unit.main;
      unit.ids = [unit.ids.find(i => i !== middle), middle,
                  unit.ids.filter(i => i !== middle).pop()];
      unit.main = middle;
    }
    unit.w = unit.ids.length * NW + (unit.ids.length - 1) * PARTNER_GAP;
  }
  return {units, home};
}

/* ---- generations --------------------------------------------------------- */
function assignGenerations(people, home){
  // Without a centre there is no first seed, and the island loop further down
  // does all the work - which is exactly what it is there for.
  const gen = new Map();
  const queue = [];
  if(centre !== null && people.has(centre)){ gen.set(centre, 0); queue.push(centre); }
  while(queue.length){
    const id = queue.shift();
    const g = gen.get(id);
    const p = BY_ID.get(id);
    const step = (other, dg) => {
      if(!people.has(other) || gen.has(other)) return;
      gen.set(other, g + dg);
      queue.push(other);
    };
    for(const x of p.parents) step(x, -1);
    for(const x of p.children) step(x, 1);
    for(const x of p.spouses) step(x, 0);
  }
  // people the centre has no path to: seed each remaining island separately
  for(const id of people){
    if(gen.has(id)) continue;
    gen.set(id, 0);
    const queue2 = [id];
    while(queue2.length){
      const cur = queue2.shift();
      const g = gen.get(cur);
      const p = BY_ID.get(cur);
      const step = (other, dg) => {
        if(!people.has(other) || gen.has(other)) return;
        gen.set(other, g + dg);
        queue2.push(other);
      };
      for(const x of p.parents) step(x, -1);
      for(const x of p.children) step(x, 1);
      for(const x of p.spouses) step(x, 0);
    }
  }
  const unitGen = new Map();
  for(const [id, unit] of home){
    const g = gen.get(id);
    if(!unitGen.has(unit) || g < unitGen.get(unit)) unitGen.set(unit, g);
  }
  for(const [unit, g] of unitGen) unit.gen = g;
  return gen;
}

/* ---- who counts as what -------------------------------------------------- */
/* Three kinds of people share the stage and they need telling apart:
     blut      a blood relative of the centre
     heirat    married to a blood relative - an in-law
     indirekt  the in-law's own family, related to the centre through nobody
   The indirect people form clans: one blood family each, hanging off the tree
   at exactly one point, the marriage of their member. */
function classify(people){
  // Nobody in the middle means nobody to be related to.  Everyone is drawn the
  // same then, and the picture makes no claim about who belongs to whom.
  if(centre === null){
    return {kind: new Map(DATA.people.map(p => [p.id, "neutral"])),
            clanOf: new Map(), clans: [], blood: new Set()};
  }
  const blood = bloodSet(centre);
  const kind = new Map(), clanOf = new Map();
  const clans = [{id: 0, members: [], name: "Stammlinie", bridge: null, via: null}];

  for(const id of people){
    if(blood.has(id)){ kind.set(id, "blut"); clanOf.set(id, 0); clans[0].members.push(id); }
  }
  for(const id of people){
    if(kind.has(id)) continue;
    const component = [];
    const queue = [id];
    const seen = new Set([id]);
    while(queue.length){
      const cur = queue.shift();
      component.push(cur);
      const p = BY_ID.get(cur);
      // marriages count here: an in-law's line reaches the main line only
      // through a wedding, but for the reader it is all one family island
      for(const other of p.parents.concat(p.children, p.spouses))
        if(people.has(other) && !blood.has(other) && !seen.has(other)){
          seen.add(other); queue.push(other);
        }
    }
    if(component.some(c => kind.has(c))) continue;
    const clan = {id: clans.length, members: component, bridge: null, via: null};
    // the member who married into the part of the tree we already know
    for(const m of component){
      const spouse = BY_ID.get(m).spouses.find(s => people.has(s) && blood.has(s));
      if(spouse !== undefined){ clan.bridge = m; clan.via = spouse; break; }
    }
    const surnames = {};
    for(const m of component){
      const s = BY_ID.get(m).surname;
      if(s) surnames[s] = (surnames[s] || 0) + 1;
    }
    // named after whoever married in, because that is how the family is known
    clan.name = (clan.bridge !== null && BY_ID.get(clan.bridge).surname)
      || Object.keys(surnames).sort((a, b) => surnames[b] - surnames[a])[0]
      || "Familie";
    for(const m of component){
      clanOf.set(m, clan.id);
      kind.set(m, m === clan.bridge ? "heirat" : "indirekt");
    }
    clans.push(clan);
  }
  // an in-law with no family of their own is still an in-law
  for(const id of people)
    if(!kind.has(id)){
      const married = BY_ID.get(id).spouses.some(s => people.has(s) && blood.has(s));
      kind.set(id, married ? "heirat" : "indirekt");
      clanOf.set(id, 0);
    }
  return {kind, clanOf, clans, blood};
}

/* ---- ordering and placement --------------------------------------------- */
function layoutUnits(units, home, people, groups){
  for(const unit of units){
    unit.parentUnits = [];
    unit.childUnits = [];
    unit.kids = [];
    unit.placed = false;
    // a unit belongs to the main line as soon as one of its people does
    unit.clan = Math.min(...unit.ids.map(i => groups.clanOf.get(i) ?? 0));
  }
  for(const unit of units){
    const kids = new Set();
    for(const m of unit.ids)
      for(const k of BY_ID.get(m).children)
        if(people.has(k)) kids.add(home.get(k));
    for(const k of kids){
      if(k === unit || k.gen <= unit.gen) continue;
      unit.childUnits.push(k);
      k.parentUnits.push(unit);
    }
  }
  for(const unit of units){
    unit.parentUnits.sort((a, b) => b.gen - a.gen || byBirth(a.main, b.main));
    // stay inside the main line where possible, so the spine is laid out first
    const own = unit.parentUnits.filter(p => p.clan === unit.clan);
    unit.primary = (own[0] || unit.parentUnits[0]) || null;
  }
  for(const unit of units)
    if(unit.primary && unit.primary.clan === unit.clan) unit.primary.kids.push(unit);
  for(const unit of units) unit.kids.sort((a, b) => byBirth(a.main, b.main));

  /* phase 1: the centre's own line, laid out as a tidy tree */
  let rowRight = new Map();
  const nextIn = g => rowRight.get(g) || 0;
  const claim = unit => rowRight.set(unit.gen, unit.x + unit.w + UNIT_GAP);

  function shift(unit, by){
    unit.x += by;
    claim(unit);
    for(const kid of unit.kids) if(kid.placed) shift(kid, by);
  }
  function tidy(unit, guard){
    if(unit.placed || guard.has(unit)) return;
    guard.add(unit);
    const kids = unit.kids.filter(k => k.clan === unit.clan);
    if(!kids.length){
      unit.x = nextIn(unit.gen);
      unit.placed = true;
      claim(unit);
      return;
    }
    for(const kid of kids) tidy(kid, guard);
    const first = kids[0], last = kids[kids.length - 1];
    let want = (first.x + last.x + last.w) / 2 - unit.w / 2;
    const floor = nextIn(unit.gen);
    if(want < floor){
      const by = floor - want;
      for(const kid of kids) shift(kid, by);
      want = floor;
    }
    unit.x = want;
    unit.placed = true;
    claim(unit);
  }

  const spine = units.filter(u => u.clan === 0);
  const roots = spine.filter(u => !u.primary || u.primary.clan !== 0)
                     .sort((a, b) => a.gen - b.gen || byBirth(a.main, b.main));
  for(const root of roots) tidy(root, new Set());
  for(const unit of spine) if(!unit.placed) tidy(unit, new Set());

  /* phase 2: every other family is laid out on its own first, as a tidy tree
     in local coordinates, and only then slid sideways as one block into the
     nearest gap beside the marriage that connects it.  Placing those units one
     at a time instead scattered the siblings across the row and was what
     produced the long lines crossing the whole chart. */
  const rowSpans = new Map();
  const spanRow = g => { if(!rowSpans.has(g)) rowSpans.set(g, []); return rowSpans.get(g); };
  const addSpan = (g, a, b) => { spanRow(g).push([a, b]); spanRow(g).sort((p, q) => p[0] - q[0]); };
  for(const unit of units) if(unit.placed) addSpan(unit.gen, unit.x, unit.x + unit.w);

  // Where would this unit like to sit, given an already placed relative?
  // Returns the wanted centre.  The unit has no x yet, so the offset of a
  // person inside their unit has to come from the index alone.
  const slotOffset = (unit, id) => unit.ids.indexOf(id) * (NW + PARTNER_GAP);
  function wishFor(unit, anchor){
    if(unit.childUnits.includes(anchor)){
      const child = anchor.ids.find(i => BY_ID.get(i).parents.some(p => unit.ids.includes(p)));
      if(child !== undefined) return anchor.x + slotOffset(anchor, child) + NW / 2;
    }
    if(unit.parentUnits.includes(anchor)){
      const mine = unit.ids.find(i => BY_ID.get(i).parents.some(p => anchor.ids.includes(p)));
      if(mine !== undefined)
        return anchor.x + anchor.w / 2 - NW / 2 - slotOffset(unit, mine) + unit.w / 2;
    }
    return anchor.x + anchor.w / 2;
  }

  const rest = units.filter(u => !u.placed);
  const byClan = new Map();
  for(const unit of rest){
    if(!byClan.has(unit.clan)) byClan.set(unit.clan, []);
    byClan.get(unit.clan).push(unit);
  }

  for(const group of byClan.values()){
    // lay the family out on its own, starting from zero
    const outer = rowRight;
    rowRight = new Map();
    const clanRoots = group.filter(u => !u.primary || u.primary.clan !== u.clan)
                           .sort((a, b) => a.gen - b.gen || byBirth(a.main, b.main));
    for(const root of clanRoots) tidy(root, new Set());
    for(const unit of group) if(!unit.placed) tidy(unit, new Set());
    rowRight = outer;

    // where does this family touch the part of the tree already drawn?
    let wish = null, localAnchor = null;
    for(const unit of group){
      const anchor = unit.parentUnits.concat(unit.childUnits)
                                     .find(n => n.placed && !group.includes(n));
      if(anchor){
        wish = wishFor(unit, anchor);
        localAnchor = unit.x + unit.w / 2;
        break;
      }
    }
    const rows = new Map();
    for(const unit of group){
      const span = rows.get(unit.gen);
      rows.set(unit.gen, span
        ? [Math.min(span[0], unit.x), Math.max(span[1], unit.x + unit.w)]
        : [unit.x, unit.x + unit.w]);
    }
    const wanted = wish === null ? 0 : wish - localAnchor;

    // slide the block until no row of it overlaps anything already there
    const clear = delta => {
      for(const [gen, [a, b]] of rows)
        for(const [c, d] of spanRow(gen))
          if(a + delta < d + UNIT_GAP && c < b + delta + UNIT_GAP) return false;
      return true;
    };
    const options = [wanted];
    for(const [gen, [a, b]] of rows)
      for(const [c, d] of spanRow(gen)){
        options.push(d + UNIT_GAP - a);
        options.push(c - UNIT_GAP - b);
      }
    options.sort((p, q) => Math.abs(p - wanted) - Math.abs(q - wanted));
    let delta = options.find(clear);
    if(delta === undefined){
      let far = 0;
      for(const [gen, [a]] of rows)
        for(const [, d] of spanRow(gen)) far = Math.max(far, d + UNIT_GAP - a);
      delta = far;
    }
    for(const unit of group) unit.x += delta;
    for(const [gen, [a, b]] of rows) addSpan(gen, a + delta, b + delta);
  }

  const levels = Array.from(new Set(units.map(u => u.gen))).sort((a, b) => a - b);
  const top = levels[0];
  for(const unit of units) unit.y = (unit.gen - top) * ROW_GAP;
  return {levels};
}

/* ---- the ancestor fan ---------------------------------------------------- */
/* Nobody descends from two children of the same couple, so the ancestors of one
   person form a tree, and a tree can always be drawn without a single crossing.
   Each couple is placed centred over the two families it came from, left family
   under the left partner.  This is the only view that can promise that; as soon
   as siblings, in-laws or their families join in, the drawing has cycles and
   crossings stop being avoidable. */
function layoutPedigree(units, home, people){
  for(const unit of units){
    unit.placed = false;
    unit.parentUnits = [];
    unit.childUnits = [];
    unit.kids = [];
    unit.clan = 0;
  }
  const up = new Map();
  for(const unit of units){
    const list = [];
    for(const m of unit.ids)                       // member order keeps the sides
      for(const p of BY_ID.get(m).parents){
        if(!people.has(p)) continue;
        const pu = home.get(p);
        if(pu && pu !== unit && !list.includes(pu)) list.push(pu);
      }
    up.set(unit, list);
  }
  for(const unit of units)
    for(const pu of up.get(unit)){ pu.childUnits.push(unit); unit.parentUnits.push(pu); }

  const rowRight = new Map();
  const floorOf = g => rowRight.has(g) ? rowRight.get(g) : 0;

  function place(unit, guard){
    if(unit.placed || guard.has(unit)) return;
    guard.add(unit);
    const parents = up.get(unit).filter(p => !p.placed);
    if(parents.length){
      for(const p of parents) place(p, guard);
      const a = Math.min(...parents.map(p => p.x));
      const b = Math.max(...parents.map(p => p.x + p.w));
      unit.x = Math.max(floorOf(unit.gen), (a + b) / 2 - unit.w / 2);
    } else {
      unit.x = floorOf(unit.gen);
    }
    unit.placed = true;
    rowRight.set(unit.gen, unit.x + unit.w + UNIT_GAP);
  }

  const start = centre === null ? null : home.get(centre);
  if(start) place(start, new Set());
  for(const unit of units) if(!unit.placed) place(unit, new Set());

  const levels = Array.from(new Set(units.map(u => u.gen))).sort((a, b) => a - b);
  const top = levels[0];
  for(const unit of units) unit.y = (unit.gen - top) * ROW_GAP;
  return {levels};
}

/* ---- turning couples around --------------------------------------------- */
/* Husband and wife each hang under their own parents.  If the parents sit the
   other way round the two descent lines cross over the couple, which reads as
   if the pair were siblings.  Swapping the two boxes fixes it, and costs
   nothing: the unit keeps its slot and its width, only the order inside
   changes.  What does move is everything placed relative to the old order, so
   the layout is simply run again afterwards. */
function pullOf(id, home, people){
  const parents = BY_ID.get(id).parents.filter(p => people.has(p));
  if(!parents.length) return null;
  const up = home.get(parents[0]);
  if(!up || up.x === undefined) return null;
  const inside = parents.filter(p => up.ids.includes(p));
  if(!inside.length) return up.x + up.w / 2;
  return inside.reduce((a, p) =>
    a + up.x + up.ids.indexOf(p) * (NW + PARTNER_GAP) + NW / 2, 0) / inside.length;
}

function orderCouples(units, home, people){
  let changed = false;
  for(const unit of units){
    if(unit.ids.length < 2) continue;
    // in a threesome the person the children belong to stays in the middle
    const movable = unit.ids.length === 3 ? [0, 2] : unit.ids.map((_, i) => i);
    const entries = movable.map(i => ({i, id: unit.ids[i], pull: pullOf(unit.ids[i], home, people)}));
    if(entries.filter(e => e.pull !== null).length < 1) continue;
    // people whose parents are unknown keep the place they already had
    const fallback = entries.map(e => unit.x + e.i * (NW + PARTNER_GAP) + NW / 2);
    entries.forEach((e, n) => { e.key = e.pull === null ? fallback[n] : e.pull; });
    const sorted = entries.slice().sort((a, b) => a.key - b.key);
    if(sorted.some((e, n) => e.id !== entries[n].id)){
      sorted.forEach((e, n) => { unit.ids[movable[n]] = e.id; });
      changed = true;
    }
  }
  return changed;
}

/* ---- drawing ------------------------------------------------------------- */
const boxX = (unit, id) => unit.x + unit.ids.indexOf(id) * (NW + PARTNER_GAP);

let design = "tafel";

function boxHTML(id, x, y, classes, tag){
  const p = BY_ID.get(id);
  return `<div class="box ${classes}${isGone(p) ? " gone" : ""}${id === armed ? " armed" : ""}" data-person="${id}"
      style="left:${x}px;top:${y}px;width:${NW}px;height:${NH}px">
      <button class="pick" data-centre="${id}"
          title="${esc(p.name)}${p.relation ? " · " + esc(p.relation) : ""} — anklicken macht diese Person zum Mittelpunkt">
        ${thumbHTML(p)}
        <span class="lines">
          <b>${esc(p.name)}</b>
